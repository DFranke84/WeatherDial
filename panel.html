<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WeatherDial</title>
<style>
  /* Dark theme (default). Light theme below overrides the same names. */
  :root {
    --face: rgba(24, 26, 30, .78); --edge: #4a4f58; --text: #e8e8e8; --dim: #9aa0aa; --faint: #5d636d;
    --line: #2f343c; --warm: #ffb347; --cold: #6cb6ff; --rain: #4d9fff; --good: #5fd068; --fair: #ffc933;
    --bad: #ff5a4f; --accent: #7cc4ff;
    --cell: #1a1c20; --hover: #ffffff08; --hover2: #ffffff14; --hair: #ffffff0a; --track: #ffffff10;
    --sel: #ffffff1c; --mark: #fff8; --menu: #222; --menuhover: #3a3f48; --tipbg: #111a;
    --devhi: #ff9b8f; --devlo: #8fc2ff; --afd: #cfd3da;
    --cgrid: #ffffff0d; --cfreeze: #6cb6ff88; --cday: #ffffff22; --cdaytxt: #ccc; --cnight: #00000030;
    --cband: #7cc4ff22; --cfeels: #9aa0aa; --ctemp: #ffb347; --crainbar: #4d9fffaa; --csnowbar: #dfe7f5aa;
    --cwind: #8a9; --ccur: #fff6;
    --cl1: #c9d0da; --cl2: #8d96a3; --cl3: #9aa4b2; --cl4: #7d8695; --csnow: #fff; --cmoon: #d7dce6; --cfog: #aab;
    --alert: #5a1a17; --alertedge: #8c2b25; --alerttxt: #ffd2cc; --alertmore: #f0d6d2;
    --warnbg: #5a4410; --warnedge: #8c6a1a;
  }
  body.light {
    --face: rgba(248, 249, 251, .9); --edge: #c3c9d2; --text: #1d2128; --dim: #575e69; --faint: #8a919c;
    --line: #dde1e7; --warm: #d0700f; --cold: #2a74c9; --rain: #2a74c9; --good: #2fa84a; --fair: #c99700;
    --bad: #d9443a; --accent: #2a74c9;
    --cell: #ffffff; --hover: #0000000a; --hover2: #00000012; --hair: #0000000f; --track: #00000014;
    --sel: #0000001a; --mark: #0009; --menu: #fff; --menuhover: #e8edf4; --tipbg: #ffffffee;
    --devhi: #d9443a; --devlo: #2a74c9; --afd: #2b3038;
    --cgrid: #00000012; --cfreeze: #2a74c988; --cday: #00000030; --cdaytxt: #333; --cnight: #0000000c;
    --cband: #2a74c926; --cfeels: #7a818c; --ctemp: #e07b12; --crainbar: #2a74c9aa; --csnowbar: #98a6baaa;
    --cwind: #3d7d5c; --ccur: #0006;
    --cl1: #a3acb9; --cl2: #6f7987; --cl3: #7f8996; --cl4: #5f6875; --csnow: #5f6875; --cmoon: #8f97a6; --cfog: #7f8996;
    --alert: #fde3df; --alertedge: #e9a59c; --alerttxt: #8c1d12; --alertmore: #5a2a24;
    --warnbg: #fff1cc; --warnedge: #e6c66a;
  }
  body.light.preview { background: #c9d6e3 linear-gradient(160deg, #e3ecf5, #b8c6d6); }
  body.light .chip { color: #111; }
  html, body { margin: 0; background: transparent; color: var(--text); user-select: none;
               font: 13px/1.35 "Segoe UI", sans-serif; }
  body.preview { background: #1d2733 linear-gradient(160deg, #24384c, #14181d); min-height: 100vh; padding: 24px; box-sizing: border-box; }
  #panel { position: relative; width: var(--pw, 500px); background: var(--face); border: 1px solid var(--edge); border-radius: 14px;
           overflow: hidden; backdrop-filter: blur(6px); }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header .place { font-weight: 600; }
  header .near { color: var(--dim); }
  header .upd { margin-left: auto; color: var(--faint); font-size: 12px; }
  .btn { cursor: pointer; color: var(--dim); padding: 0 4px; border-radius: 4px; }
  .btn:hover { color: var(--text); background: var(--hover2); }

  .alert { padding: 7px 12px; background: var(--alert); border-bottom: 1px solid var(--alertedge); cursor: pointer; }
  .alert.moderate { background: var(--warnbg); border-color: var(--warnedge); }
  .alert b { color: var(--alerttxt); }
  .alert .more { display: none; white-space: pre-wrap; color: var(--alertmore); margin-top: 6px; font-size: 12px; }
  .alert.open .more { display: block; }

  .now .clock { text-align: right; align-self: start; white-space: nowrap; }
  .now .clock .tm { font-size: 22px; font-weight: 300; line-height: 1.1; }
  .now .clock .dt { color: var(--dim); font-size: 12px; }
  .now { display: grid; grid-template-columns: 74px auto 1fr auto; gap: 4px 12px; padding: 10px 12px 6px; align-items: center; }
  .now .big { font-size: 46px; font-weight: 300; line-height: 1; }
  .now .big sup { font-size: 20px; color: var(--dim); }
  .now .cond { font-size: 15px; }
  .now .from { color: var(--dim); font-size: 12px; }
  .now .hilo { color: var(--dim); }
  .now .hilo b { color: var(--text); font-weight: 600; }
  .now .hilo small { color: var(--faint); }
  .now .hilo .lbl { display: inline-block; min-width: 54px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .now .rate { font-size: 12px; font-weight: 600; text-align: center; margin-top: 2px; cursor: help; white-space: nowrap; }
  .now .feels { font-size: 12px; color: var(--dim); text-align: center; cursor: help; }
  .now .hilo { white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line);
           border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { background: var(--cell); padding: 5px 8px; min-height: 34px; }
  .stat .k { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-weight: 600; }
  .stat .v small { font-weight: 400; color: var(--dim); }

  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav div { flex: 1; text-align: center; padding: 6px 0; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; }
  nav div:hover { color: var(--text); }
  nav div.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab { display: none; padding: 8px 12px 10px; height: var(--tabh, 360px); overflow-y: auto; }
  #grip { height: 9px; cursor: ns-resize; display: flex; align-items: center; justify-content: center;
          border-top: 1px solid var(--line); touch-action: none; }
  #grip::after { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--faint); }
  #grip:hover::after { background: var(--accent); }
  body.compact #grip { display: none; }
  .pywebview-drag-region { cursor: move; }
  #menu { position: fixed; background: var(--menu); border: 1px solid var(--edge); border-radius: 6px; z-index: 20;
          font-size: 13px; color: var(--text); padding: 4px 0; white-space: nowrap; }
  #menu div { padding: 4px 14px; cursor: default; }
  #menu div:hover { background: var(--menuhover); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
  .tab.on { display: block; }
  .tab::-webkit-scrollbar { width: 6px; } .tab::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .seg span { padding: 1px 9px; cursor: pointer; color: var(--dim); }
  .seg span.on { background: var(--sel); color: var(--text); }
  .legend { color: var(--dim); font-size: 11px; margin-left: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 3px 0 8px; }

  svg text { fill: var(--dim); font-size: 10px; }
  #tip { position: fixed; pointer-events: none; background: var(--tipbg); border: 1px solid var(--edge); border-radius: 6px;
         padding: 5px 8px; font-size: 12px; display: none; backdrop-filter: blur(4px); z-index: 9; }

  .day { display: grid; grid-template-columns: 44px 26px minmax(110px, 1fr) 34px 30px minmax(140px, 1.3fr) 30px 14px; gap: 6px; align-items: center;
         padding: 3px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .day:hover { background: var(--hover); }
  .day .dn { font-weight: 600; } .day .dn small { display: block; color: var(--faint); font-weight: 400; font-size: 11px; }
  .day .txt { color: var(--dim); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .day .pop { color: var(--rain); text-align: right; }
  .day .lo { color: var(--cold); text-align: right; } .day .hi { color: var(--warm); }
  .bar { position: relative; height: 6px; background: var(--track); border-radius: 3px; }
  .bar .rng { position: absolute; top: 0; height: 6px; border-radius: 3px; }
  .bar .sp { position: absolute; top: -3px; height: 12px; border-left: 1px solid var(--mark); border-right: 1px solid var(--mark); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .detail { display: none; padding: 4px 4px 8px 50px; color: var(--dim); font-size: 12px; }
  .detail.open { display: block; }
  .detail p { margin: 3px 0; } .detail b { color: var(--text); }
  .detail table { border-collapse: collapse; margin-top: 4px; }
  .detail td { padding: 1px 8px 1px 0; }

  table.cmp { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.cmp th { color: var(--dim); font-weight: 400; text-align: center; padding: 2px; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; white-space: nowrap; }
  table.cmp td { text-align: center; padding: 3px 2px; border-top: 1px solid var(--hair); }
  table.cmp tr.cons td { border-top: 1px solid var(--edge); font-weight: 600; }
  .dev-hi { color: var(--devhi); } .dev-lo { color: var(--devlo); }
  h4 { margin: 10px 0 4px; font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  #wgrip { position: absolute; top: 40px; right: 0; bottom: 20px; width: 7px; cursor: ew-resize; z-index: 8;
           display: flex; align-items: center; justify-content: center; touch-action: none; }
  #wgrip::after { content: ""; width: 3px; height: 40px; border-radius: 2px; background: var(--faint); opacity: 0; transition: opacity .2s; }
  #panel:hover #wgrip::after { opacity: 1; }
  #wgrip:hover::after { background: var(--accent); }
  body.compact #wgrip { bottom: 6px; }
  #radar { position: relative; width: 100%; height: 300px; overflow: hidden; border-radius: 8px; background: #111; }
  #radar img { position: absolute; width: 256px; height: 256px; }
  #radar .layer { position: absolute; inset: 0; }
  #radar .me { position: absolute; width: 8px; height: 8px; margin: -5px 0 0 -5px; border: 1px solid #fff;
               background: var(--bad); border-radius: 50%; z-index: 5; }
  #radar .stamp { position: absolute; left: 8px; bottom: 6px; z-index: 6; background: #000a; padding: 1px 6px; border-radius: 4px; }
  #radar .credit { position: absolute; right: 6px; bottom: 4px; z-index: 6; font-size: 10px; color: #aaa; }

  #mc { padding: 2px 12px 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
  #mc[hidden] { display: none; }
  #mc .ph { font-weight: 600; }
  #mc .ph small { font-weight: 400; color: var(--faint); }
  #mc .strip { grid-column: 1 / -1; position: relative; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  #mc .strip i { position: absolute; top: 0; bottom: 0; }
  #mc .ticks { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; }
  table.idx { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.idx th { color: var(--faint); font-weight: 400; text-align: center; padding: 1px 2px; }
  table.idx td { padding: 3px 2px; border-top: 1px solid var(--hair); text-align: center; }
  table.idx td:first-child { text-align: left; white-space: nowrap; }
  .chip { display: inline-block; min-width: 92px; padding: 1px 6px; border-radius: 4px; color: #111; font-weight: 600; font-size: 11px; }
  .sq { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }
  pre.afd { white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; color: var(--afd); margin: 0; }
  .acc { display: inline-block; min-width: 40px; padding: 0 4px; border-radius: 4px; color: #111; font-size: 11px;
         font-weight: 600; text-align: center; cursor: help; }
  .acc.none { background: var(--track); color: var(--faint); font-weight: 400; }
  .accbar { color: var(--dim); font-size: 12px; margin: 2px 0 6px; cursor: help; }
  .accbar small { color: var(--faint); }
  #t-gauges { position: relative; }
  .gbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .gbar .help { margin-left: auto; cursor: pointer; color: var(--accent); }
  .gcap { color: var(--dim); font-size: 12px; text-align: center; margin-top: 2px; }
  .gcap b { color: var(--text); }
  .dials { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dials svg { width: 100%; height: auto; display: block; }
  .helpbox { position: absolute; inset: 6px; background: var(--cell); border: 1px solid var(--edge); border-radius: 10px;
             padding: 10px 14px; overflow-y: auto; z-index: 7; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 24px #0006; }
  .helpbox h3 { margin: 2px 0 6px; font-size: 14px; }
  .helpbox h5 { margin: 10px 0 3px; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .helpbox ul { margin: 0; padding-left: 18px; } .helpbox li { margin: 2px 0; }
  .helpbox table { border-collapse: collapse; margin-top: 4px; } .helpbox td { padding: 2px 8px 2px 0; vertical-align: top; }
  .helpbox .x { position: absolute; top: 6px; right: 10px; cursor: pointer; color: var(--dim); font-size: 16px; }
  .wtog { display: block; margin-top: 3px; cursor: help; }
  .wtog input { vertical-align: -2px; margin: 0 4px 0 0; cursor: pointer; }
  .accsel { background: var(--cell); color: var(--text); border: 1px solid var(--edge); border-radius: 4px; font: inherit; }
  .src { display: grid; grid-template-columns: 12px 1fr auto 52px; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--hair); }
  .src .note { color: var(--faint); font-size: 12px; }
  a { color: var(--accent); }
  body.compact nav, body.compact .tab, body.compact .stats .extra { display: none !important; }
  .mini3 { display: none; padding: 6px 12px 10px; gap: 6px; }
  body.compact .mini3 { display: flex; }
  .mini3 div { flex: 1; text-align: center; background: var(--hover); border-radius: 6px; padding: 4px; }
</style>
</head>
<body>
<div id="panel">
  <header class="drag">
    <span class="place" id="place">…</span><span class="near" id="near"></span>
    <span class="upd" id="upd"></span>
    <span class="btn" id="bCompact" title="Compact / full">▭</span>
    <span class="btn" id="bRefresh" title="Refresh now">⟳</span>
  </header>
  <div id="alerts"></div>
  <div class="now drag" id="now"></div>
  <div id="mc" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="mini3" id="mini3"></div>
  <nav id="nav">
    <div data-t="hourly" class="on">Hourly</div><div data-t="daily">16-Day</div><div data-t="compare">Compare</div>
    <div data-t="radar">Radar</div><div data-t="gauges">Gauges</div><div data-t="health" id="navHealth" hidden>Health</div><div data-t="afd">Forecaster</div><div data-t="sources">Sources</div>
  </nav>
  <div class="tab on" id="t-hourly"></div>
  <div class="tab" id="t-daily"></div>
  <div class="tab" id="t-compare"></div>
  <div class="tab" id="t-radar"><div id="radar"></div><div style="margin-top:6px;color:var(--dim)" id="radarInfo"></div></div>
  <div class="tab" id="t-gauges"></div>
  <div class="tab" id="t-health"></div>
  <div class="tab" id="t-afd"></div>
  <div class="tab" id="t-sources"></div>
  <div id="grip" title="Drag to make the panel taller or shorter. Double-click: fit this tab."></div>
  <div id="wgrip" title="Drag to make the panel wider or narrower. Double-click: normal width."></div>
</div>
<div id="tip"></div>
<div id="menu" hidden>
  <div data-act="lock" id="mLock">Lock position</div>
  <div data-act="compact" id="mCompact">Compact</div>
  <hr>
  <div data-zoom="0.85">Size: Small</div>
  <div data-zoom="1">Size: Medium</div>
  <div data-zoom="1.15">Size: Large</div>
  <hr>
  <div data-theme="dark">Theme: Dark</div>
  <div data-theme="light">Theme: Light</div>
  <div data-theme="auto">Theme: Match Windows</div>
  <hr>
  <div data-act="refresh_now">Refresh now</div>
  <div data-act="edit_keys">Edit API keys…</div>
  <div data-act="edit_location">Edit location…</div>
  <hr>
  <div data-act="quit">Close WeatherDial</div>
</div>
<script>
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
if (Q.has("preview")) document.body.classList.add("preview");
let D = null, hourSpan = 48, radarTimer = null;

// ---------------------------------------------------------------- icons (inline SVG)
const SUN = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" style="fill:#ffc94a"/>` +
  [...Array(8)].map((_, i) => { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
    return `<line x1="${x + c * r * 1.45}" y1="${y + s * r * 1.45}" x2="${x + c * r * 1.95}" y2="${y + s * r * 1.95}" stroke="#ffc94a" stroke-width="2" stroke-linecap="round"/>`; }).join("");
const MOON = (x, y, r) => `<path d="M${x + r * .3} ${y - r} a${r} ${r} 0 1 0 ${r * .75} ${r * 1.55} a${r * .8} ${r * .8} 0 0 1 -${r * .75} -${r * 1.55}z" style="fill:var(--cmoon)"/>`;
const CLOUD = (dx = 0, dy = 0, fill = "--cl1") => `<path transform="translate(${dx} ${dy})" d="M9 27h17a6 6 0 0 0 0-12 8 8 0 0 0-15-2 6.5 6.5 0 0 0-2 14z" style="fill:var(${fill})"/>`;
const drops = (c, kind) => [10, 17, 24].map((x, i) => kind === "snow"
  ? `<text x="${x - 2}" y="${36 + (i % 2) * 2}" style="fill:var(--csnow);font-size:9px">✱</text>`
  : `<line x1="${x}" y1="${30 + (i % 2)}" x2="${x - 2}" y2="${36 + (i % 2)}" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`).join("");
function icon(kind, size = 26, night = false) {
  let s;
  switch (kind) {
    case "clear": s = night ? MOON(18, 18, 9) : SUN(18, 18, 7); break;
    case "partly": s = (night ? MOON(23, 12, 7) : SUN(24, 12, 5.5)) + CLOUD(-2, 4); break;
    case "cloudy": s = CLOUD(2, -2, "--cl2") + CLOUD(-2, 3); break;
    case "rain": case "drizzle": s = CLOUD(-1, -2, "--cl3") + drops("#4d9fff"); break;
    case "snow": s = CLOUD(-1, -2) + drops("var(--csnow)", "snow"); break;
    case "sleet": s = CLOUD(-1, -2, "--cl3") + `<line x1="10" y1="30" x2="8" y2="36" stroke="#4d9fff" stroke-width="2"/><text x="15" y="37" style="fill:var(--csnow);font-size:9px">✱</text><line x1="26" y1="30" x2="24" y2="36" stroke="#4d9fff" stroke-width="2"/>`; break;
    case "storm": s = CLOUD(-1, -3, "--cl4") + `<path d="M18 24l-4 7h4l-3 7 8-9h-4l3-5z" fill="#ffd23f"/>`; break;
    case "fog": s = CLOUD(-1, -5) + [26, 31, 36].map(y => `<line x1="6" y1="${y}" x2="30" y2="${y}" style="stroke:var(--cfog)" stroke-width="2" stroke-linecap="round"/>`).join(""); break;
    case "smoke": s = [12, 19, 26].map((y, i) => `<path d="M5 ${y}q6-5 12 0t13 0" stroke="#b9a58a" stroke-width="2.5" fill="none"/>`).join(""); break;
    case "wind": s = `<path d="M4 14h18a4 4 0 1 0-4-4M4 21h24a4 4 0 1 1-4 4M4 28h12" style="stroke:var(--cl1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>`; break;
    default: s = CLOUD(); }
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 40">${s}</svg>`;
}

// ---------------------------------------------------------------- helpers
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => d == null ? "" : DIRS[Math.round(d / 22.5) % 16];
const f0 = v => v == null ? "–" : Math.round(v);
const dayName = (s, long) => { const d = new Date(s + "T12:00"); return d.toLocaleDateString("en-US", { weekday: long ? "long" : "short" }); };
const hourLabel = t => { let h = +t.slice(11, 13); return h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : (h - 12) + "p"; };
const clock = s => s ? new Date(s).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "–";
const hm = s => s ? clock(s).replace(" AM", "a").replace(" PM", "p") : "–";
const tempColor = t => t == null ? "#888" : t < 10 ? "#a78bff" : t < 32 ? "#6cb6ff" : t < 50 ? "#7fd6c2" : t < 70 ? "#c6e06a" : t < 85 ? "#ffb347" : "#ff6a4f";
const aqiInfo = a => a == null ? ["–", "#888"] : a <= 50 ? ["Good", "#5fd068"] : a <= 100 ? ["Moderate", "#ffc933"] : a <= 150 ? ["Unhealthy (sensitive)", "#ff8c3a"] : a <= 200 ? ["Unhealthy", "#ff4f4f"] : ["Very unhealthy", "#b04fff"];
const isNight = () => { const s = D?.sky?.today; if (!s) return false; const n = new Date(); return n < new Date(s.sunrise) || n > new Date(s.sunset); };
const hhmm = s => { if (!s) return ""; let [h, m] = s.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")}${h < 12 ? "a" : "p"}`; };
function windTip(w) {
  if (!w) return "";
  const t = w.today, y = w.yesterday, lines = [];
  lines.push(`Max today: wind ${f0(t.wind)} mph (${hhmm(t.wind_at)}), gust ${f0(t.gust)} mph (${hhmm(t.gust_at)})`);
  if (t.since && t.since !== "00:00") lines.push(`  (since ${hhmm(t.since)}, when WeatherDial started)`);
  if (y) lines.push(`Max yesterday: wind ${f0(y.wind)} mph, gust ${f0(y.gust)} mph` + (y.since && y.since !== "00:00" ? ` (from ${hhmm(y.since)})` : ""));
  return lines.join("\n");
}
// Clock at the top right, updated every second.
function tick() {
  const n = new Date(), t = $("clkT"), d = $("clkD");
  if (!t) return;
  t.textContent = n.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  d.textContent = n.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
setInterval(tick, 1000);
const moonGlyph = p => ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][Math.round(p * 8) % 8];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(iso) {
  if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago";
}

// ---------------------------------------------------------------- render
function render() {
  const L = D.location, n = D.now || {}, today = D.days[0] || {}, sky = D.sky.today || {};
  $("place").textContent = L.name;
  $("near").textContent = L.near ? `· near ${L.near} · ${L.elevation_ft.toLocaleString()} ft` : "";
  $("upd").textContent = "updated " + clock(D.updated);

  $("alerts").innerHTML = D.alerts.map((a, i) => `<div class="alert ${/minor|moderate/i.test(a.severity) ? "moderate" : ""}" data-i="${i}">
    ⚠ <b>${esc(a.event)}</b> <span style="color:var(--alertmore)">until ${clock(a.ends)}</span>
    <div class="more">${esc(a.description)}${a.instruction ? "\n\n" + esc(a.instruction) : ""}</div></div>`).join("");

  const G = D.gauges || {}, act = G.t_today, tr = G.t_rate_1h;
  const rateTxt = (v, unit, dec) => v == null ? "" : `${v > 0 ? "▲ +" : v < 0 ? "▼ −" : "● "}${Math.abs(v).toFixed(dec)}${unit}`;
  const rateCol = v => v == null || Math.abs(v) < 0.05 ? "var(--dim)" : v > 0 ? "var(--warm)" : "var(--cold)";
  const actTip = act ? `Measured by your station today${act.since && act.since !== "00:00" ? ` (since ${hhmm(act.since)}, when WeatherDial started)` : " (since midnight)"}:\n` +
    `High ${act.hi.toFixed(1)}°F at ${hhmm(act.hi_at) || "–"}, low ${act.lo.toFixed(1)}°F at ${hhmm(act.lo_at) || "–"}.\nThe "Forecast" line above is the average of all sources for the whole day.` : "";
  $("now").innerHTML = `<div>${icon(n.icon, 70, isNight())}</div>
    <div><div class="big">${f0(n.temp)}<sup>°F</sup></div>
      ${tr != null ? `<div class="rate" style="color:${rateCol(tr)}" title="Temperature change over the last hour: ${tr > 0 ? "+" : ""}${tr.toFixed(1)}°F">${rateTxt(tr, "°/hr", 1)}</div>` : ""}
      <div class="feels" title="Feels like: wind chill when cold and windy, heat index when hot and humid">feels ${f0(n.feels)}°</div></div>
    <div><div class="cond">${esc(n.text || "")}</div>
      <div class="hilo" title="Forecast high and low for today: the average of all sources"><span class="lbl">Forecast</span> <b>${f0(today.hi)}°</b> / <b>${f0(today.lo)}°</b> <small>high / low</small></div>
      ${act ? `<div class="hilo" title="${esc(actTip)}"><span class="lbl">So far</span> <b>${f0(act.hi)}°</b> / <b>${f0(act.lo)}°</b> <small>${hhmm(act.hi_at)} / ${hhmm(act.lo_at)}</small></div>` : ""}
      <div class="from">from ${esc(n.station || "–")} · ${n.age_s != null ? (n.age_s < 60 ? n.age_s + " s ago" : ago(n.time)) : ago(n.time)}</div></div>
    <div class="clock"><div class="tm" id="clkT"></div><div class="dt" id="clkD"></div></div>`;
  tick();

  const aq = aqiInfo(D.air?.us_aqi);
  const trendArrow = { rising: "↗", falling: "↘", steady: "→" }[n.trend] || "";
  const lastStrike = n.strike_time ? new Date(n.strike_time * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
  const strikes = n.strikes_3h != null ? (n.strikes_3h ? `${n.strikes_3h} <small>in 3 h · last ${f0(n.strike_dist)} mi</small>`
                                                         : `<small title="Last strike ${lastStrike}, ${f0(n.strike_dist)} mi away">none · last ${lastStrike}</small>`)
                                         : `<small>add Tempest token</small>`;
  const stats = [
    ["Wind", `${f0(n.wind)} <small>${compass(n.dir)} · gust ${f0(n.gust)}</small>`, "", windTip(n.wind_max)],
    ["Humidity", `${f0(n.rh)}% <small>dew ${f0(n.dew)}°</small>`],
    ["Pressure", `${n.pressure ? n.pressure.toFixed(2) : "–"} <small>${trendArrow} ${n.trend || "inHg"}</small>` +
      (G.p_rate_1h != null ? ` <small style="color:${rateCol(G.p_rate_1h * 100)}">${G.p_rate_1h >= 0 ? "+" : "−"}${Math.abs(G.p_rate_1h).toFixed(3)}/hr</small>` : ""), "",
     `Pressure (sea level): ${n.pressure ? (+n.pressure).toFixed(3) : "–"} inHg` +
      (G.p_rate_1h != null ? `\nChange over the last hour: ${G.p_rate_1h >= 0 ? "+" : ""}${G.p_rate_1h.toFixed(3)} in` : "") +
      (G.p_3h != null && n.pressure ? `\nOver the last 3 hours: ${(+n.pressure - G.p_3h) >= 0 ? "+" : ""}${(+n.pressure - G.p_3h).toFixed(3)} in (${n.trend || "–"})` : "") +
      `\nRising usually means improving weather; falling means change on the way.`],
    ["Rain today", `${n.rain_today != null ? n.rain_today.toFixed(2) + '"' : "–"} <small>${n.rain_rate ? "falling now" : ""}</small>`, "",
     n.rain_yesterday != null ? `Rain yesterday: ${(+n.rain_yesterday).toFixed(2)}"` : "Rain yesterday needs the Tempest cloud token"],
    ["UV / sun", `${n.uv ?? sky.uv ?? "–"} <small>${n.solar != null ? Math.round(n.solar) + " W/m²" : ""}</small>`, "extra"],
    ["Sun · moon", `<small>↑</small>${hm(sky.sunrise)} <small>↓</small>${hm(sky.sunset)} <small title="${D.sky.moon.name}, ${D.sky.moon.illum}% lit">${moonGlyph(D.sky.moon.phase)}</small>`, "extra"],
    ["Air quality", `<span style="color:${aq[1]}">${D.air?.us_aqi ?? "–"}</span> <small>${aq[0]}</small>`, "extra"],
    ["Lightning", strikes, "extra"],
  ];
  $("stats").innerHTML = stats.map(([k, v, c, tip]) => `<div class="stat ${c || ""}"${tip ? ` title="${esc(tip)}"` : ""}><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("mini3").innerHTML = D.days.slice(0, 4).map((d, i) => `<div>${i ? dayName(d.date) : "Today"}<br>${icon(d.icon, 26)}<br>
    <span style="color:var(--warm)">${f0(d.hi)}°</span> <span style="color:var(--cold)">${f0(d.lo)}°</span></div>`).join("");

  renderMinuteCast(); renderHealth(); renderGauges();
  if ($("t-radar").classList.contains("on")) radar();   // keeps an open radar tab current
  renderHourly(); renderDaily(); renderCompare(); renderAfd(); renderSources();
}

// ---------------------------------------------------------------- optional AccuWeather extras
// Both appear only when there's data (AccuWeather key with MinuteCast / indices access).
function renderMinuteCast() {

  box.hidden = !m;
  if (!m) return;
  const col = { rain: "#4d9fff", snow: "#e6edf7", ice: "#b48cff", mix: "#9ec5ff" };
  const segs = m.segments.filter(s => s.type).map(s =>
    `<i style="left:${s.start / 120 * 100}%;width:${(s.end - s.start + 1) / 120 * 100}%;background:${col[s.type] || "#4d9fff"}" title="${s.type} from ${s.start} to ${s.end + 1} min"></i>`).join("");
  const wet = m.segments.some(s => s.type);
  box.innerHTML = `<div>${icon(m.type === "snow" ? "snow" : wet ? "rain" : "clear", 20)}</div>
    <div class="ph">${esc(m.phrase || "No rain or snow for the next 2 hours")} <small>· next 2 hours, as of ${hm(m.at)} · AccuWeather MinuteCast</small></div>
    ${wet ? `<div class="strip">${segs}</div><div class="ticks"><span>now</span><span>30</span><span>60</span><span>90</span><span>120 min</span></div>` : ""}`;
}

const goodness = (x, d) => d.level == null ? null : x.ascending ? d.level : 6 - d.level;   // 5 = best
const goodCol = g => g == null ? "#555" : ["#ff5a4f", "#ff9a4f", "#ffc933", "#a7d86a", "#5fd068"][Math.max(1, Math.min(5, g)) - 1];
function renderHealth() {
  const G = D.indices;
  $("navHealth").hidden = !G;

  const days = G[0].items[0].days.slice(0, 5);

  for (const g of G) {
    h += `<h4>${esc(g.group)}</h4><table class="idx"><tr><th></th><th>Today</th>${days.slice(1).map(d => `<th>${dayName(d.date)}</th>`).join("")}</tr>`;
    for (const x of g.items) {
      const t = x.days[0];
      h += `<tr><td>${esc(x.name)}</td>

        ${x.days.slice(1, 5).map(d => `<td><span class="sq" style="background:${goodCol(goodness(x, d))}" title="${esc(x.name)}, ${dayName(d.date, true)}: ${esc(d.category)}"></span></td>`).join("")}</tr>`;
    }

  }

    <span class="sq" style="background:#ff5a4f;width:10px;height:10px"></span> poor or risky. Hover a square for the day's rating. From AccuWeather.</p>`;
  $("t-health").innerHTML = h;
}

function renderHourly(force) {
  if (!force && $("tip").style.display === "block") return;   // don't redraw under your mouse
  const H = D.hourly.slice(0, hourSpan), W = innerW(), top = 30, ch = 120, pb = 40, bot = top + ch + pb + 34;
  const temps = H.flatMap(h => [h.temp, ...Object.values(h.by || {})]).filter(v => v != null);
  const tmin = Math.floor(Math.min(...temps) - 2), tmax = Math.ceil(Math.max(...temps) + 2);
  const x = i => 30 + i * (W - 44) / (H.length - 1), y = t => top + ch - (t - tmin) / (tmax - tmin) * ch;
  // label spacing: as many hours as fit (about 26 px per label)
  const step = [1, 2, 3, 6, 12, 24].find(s => s * (W - 44) / H.length >= 26) || 24;
  let s = "";
  // grid + day boundaries
  for (let t = Math.ceil(tmin / 5) * 5; t <= tmax; t += 5) s += `<line x1="30" x2="${W - 14}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--cgrid)"/><text x="0" y="${y(t) + 3}">${t}</text>`;
  if (tmin < 32 && tmax > 32) s += `<line x1="30" x2="${W - 14}" y1="${y(32)}" y2="${y(32)}" style="stroke:var(--cfreeze)" stroke-dasharray="3 3"/><text x="${W - 40}" y="${y(32) - 3}" style="fill:var(--cfreeze)">freezing</text>`;
  H.forEach((h, i) => { if (h.t.endsWith("T00:00") && i) s += `<line x1="${x(i)}" x2="${x(i)}" y1="${top - 8}" y2="${bot - 18}" style="stroke:var(--cday)"/><text x="${x(i) + 3}" y="${top - 2}" style="fill:var(--cdaytxt)">${dayName(h.t.slice(0, 10))}</text>`; });
  // night shading
  H.forEach((h, i) => { if (!h.day) s += `<rect x="${x(i) - (W - 44) / (H.length - 1) / 2}" y="${top - 8}" width="${(W - 44) / (H.length - 1)}" height="${ch + 8}" style="fill:var(--cnight)"/>`; });
  // model spread band
  const lo = H.map(h => Math.min(...Object.values(h.by || {}).filter(v => v != null), h.temp));
  const hi = H.map(h => Math.max(...Object.values(h.by || {}).filter(v => v != null), h.temp));
  s += `<path d="M${H.map((_, i) => `${x(i)} ${y(hi[i])}`).join("L")}L${H.map((_, i) => `${x(H.length - 1 - i)} ${y(lo[H.length - 1 - i])}`).join("L")}Z" style="fill:var(--cband)"/>`;
  // feels-like + temp lines
  s += `<path d="M${H.map((h, i) => `${x(i)} ${y(h.feels ?? h.temp)}`).join("L")}" fill="none" style="stroke:var(--cfeels)" stroke-width="1" stroke-dasharray="2 3"/>`;
  s += `<path d="M${H.map((h, i) => `${x(i)} ${y(h.temp)}`).join("L")}" fill="none" style="stroke:var(--ctemp)" stroke-width="2.2"/>`;
  // precip chance bars + amount
  const pTop = top + ch + 6;
  H.forEach((h, i) => { const p = h.pop || 0, bw = Math.max(2, (W - 44) / H.length - 1);
    s += `<rect x="${x(i) - bw / 2}" y="${pTop + pb - p / 100 * pb}" width="${bw}" height="${p / 100 * pb}" style="fill:var(${h.icon === "snow" ? "--csnowbar" : "--crainbar"})"/>`; });
  s += `<text x="0" y="${pTop + 8}">%</text>`;
  // icons, temps and hour labels
  H.forEach((h, i) => { if (i % step) return;
    s += `<g transform="translate(${x(i) - 9} ${y(h.temp) - 26})">${icon(h.icon, 18, !h.day)}</g>`;
    s += `<text x="${x(i)}" y="${bot - 20}" text-anchor="middle">${hourLabel(h.t)}</text>`;
    s += `<text x="${x(i)}" y="${bot - 6}" text-anchor="middle" style="fill:var(--cwind)">${f0(h.wind)}</text>`; });
  s += `<text x="0" y="${bot - 6}" style="fill:var(--cwind)">mph</text>`;
  // "Now" marker: where the current time falls between the first hours of the chart.
  const frac = (Date.now() - new Date(H[0].t)) / 3600000;
  if (frac >= 0 && frac <= H.length - 1) {
    const xn = x(0) + frac * (W - 44) / (H.length - 1), i0 = Math.floor(frac), f = frac - i0;
    const tn = H[i0].temp + ((H[i0 + 1]?.temp ?? H[i0].temp) - H[i0].temp) * f;
    s += `<line x1="${xn}" x2="${xn}" y1="${top - 8}" y2="${bot - 18}" style="stroke:var(--accent)" stroke-width="1.5"/>
      <circle cx="${xn}" cy="${y(tn)}" r="3.5" style="fill:var(--accent);stroke:var(--cell)" stroke-width="1.5"/>
      <rect x="${xn - 15}" y="${top - 21}" width="30" height="13" rx="3" style="fill:var(--accent)"/>
      <text x="${xn}" y="${top - 11}" text-anchor="middle" style="fill:var(--cell);font-weight:600">now</text>`;
  }
  s += `<line id="cur" y1="${top - 8}" y2="${bot - 18}" style="stroke:var(--ccur)" visibility="hidden"/>`;
  $("t-hourly").innerHTML = `<div><span class="seg" id="span"><span data-h="48" class="${hourSpan === 48 ? "on" : ""}">48 hours</span><span data-h="168" class="${hourSpan === 168 ? "on" : ""}">7 days</span></span>
    <span class="legend"><i style="background:var(--ctemp)"></i>forecast<i style="height:0;border-top:2px dotted var(--cfeels)" title="Wind chill when cold and windy, heat index when hot and humid; otherwise the same as the temperature"></i><span title="Wind chill when cold and windy, heat index when hot and humid; otherwise the same as the temperature">feels like</span><i style="background:var(--cband);height:8px"></i><span title="The shaded band: the lowest to highest temperature any source forecasts for that hour">range</span><i style="background:var(--crainbar);height:8px"></i><span title="Bars: chance of rain or snow (white bars = snow)">rain/snow %</span></span></div>
    <svg id="hsvg" width="${W}" height="${bot}">${s}</svg>`;
  const svg = $("hsvg"), tip = $("tip");
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(H.length - 1, Math.round((e.clientX - r.left - 30) / ((W - 44) / (H.length - 1))))), h = H[i];
    const c = $("cur"); c.setAttribute("x1", x(i)); c.setAttribute("x2", x(i)); c.setAttribute("visibility", "visible");
    const by = Object.entries(h.by || {}).map(([k, v]) => `<div style="color:#aaa">${k}: ${f0(v)}°</div>`).join("");
    tip.innerHTML = `<b>${dayName(h.t.slice(0, 10))} ${hourLabel(h.t)}</b> ${esc(h.text || "")}<br>${f0(h.temp)}°F (feels ${f0(h.feels)}°) · ${h.pop ?? 0}% · wind ${f0(h.wind)}${h.gust > h.wind ? ", gusts " + f0(h.gust) : ""} mph${h.aqi != null ? " · AQI " + h.aqi : ""}${by}`;
    tip.style.display = "block";
    const z = +document.body.style.zoom || 1, vw = innerWidth / z, vh = innerHeight / z;
    tip.style.left = Math.max(2, Math.min(e.clientX + 14, vw - tip.offsetWidth - 4)) + "px";
    tip.style.top = (e.clientY + 14 + tip.offsetHeight > vh ? Math.max(2, e.clientY - tip.offsetHeight - 10) : e.clientY + 14) + "px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; $("cur").setAttribute("visibility", "hidden"); };
  $("span").onclick = e => { if (e.target.dataset.h) { hourSpan = +e.target.dataset.h; renderHourly(); } };
}

function renderDaily() {
  const days = D.days, all = days.flatMap(d => [d.lo_min, d.hi_max]).filter(v => v != null);
  const mn = Math.min(...all), mx = Math.max(...all), pct = v => (v - mn) / (mx - mn) * 100;
  const agreeCol = { good: "var(--good)", fair: "var(--fair)", low: "var(--bad)" };
  const periods = D.periods || [];
  $("t-daily").innerHTML = days.map((d, i) => {
    const date = new Date(d.date + "T12:00"), dd = D.detail_days[d.date] || {};
    const txt = (d.by["NWS (official)"] || {}).text || dd.text || "";
    const name = i === 0 ? "Today" : dayName(d.date);
    const myP = periods.filter(p => p.name && periodDate(p) === d.date);
    const srcRows = Object.entries(d.by).map(([k, v]) => `<tr><td>${k}</td><td style="color:var(--warm)">${f0(v.hi)}°</td><td style="color:var(--cold)">${f0(v.lo)}°</td><td style="color:var(--rain)">${v.pop != null ? v.pop + "%" : ""}</td><td>${esc(v.text || "")}</td></tr>`).join("");
    return `<div class="day" data-i="${i}">
      <div class="dn">${name}<small>${date.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</small></div>
      <div>${icon(d.icon, 24)}</div><div class="txt" title="${esc(txt)}">${esc(txt)}</div>
      <div class="pop">${d.pop ? d.pop + "%" : ""}</div>
      <div class="lo">${f0(d.lo)}°</div>
      <div class="bar"><div class="sp" style="left:${pct(d.lo_min ?? d.lo)}%;width:${pct(d.hi_max ?? d.hi) - pct(d.lo_min ?? d.lo)}%"></div>
        <div class="rng" style="left:${pct(d.lo)}%;width:${Math.max(2, pct(d.hi) - pct(d.lo))}%;background:linear-gradient(90deg,${tempColor(d.lo)},${tempColor(d.hi)})"></div></div>
      <div class="hi">${f0(d.hi)}°</div>
      <div class="dot" title="${esc(`How well the sources agree on this day: ${{ good: "GOOD", fair: "FAIR", low: "LOW" }[d.agree] || "–"}\n` +
        `Highs ${d.hi_min}–${d.hi_max}°, lows ${d.lo_min ?? "–"}–${d.lo_max ?? "–"}° across ${d.hi_n} sources.\n\n` +
        `Green = good: every source's high and low within 5° of each other.\n` +
        `Yellow = fair: within 10°.\n` +
        `Red = low: more than 10° apart, so the forecast for this day is uncertain.`)}" style="background:${agreeCol[d.agree]}"></div>
    </div>
    <div class="detail" id="dd${i}">
      ${myP.map(p => `<p><b>${p.name}:</b> ${esc(p.detail)}</p>`).join("")}
      ${dd.sunrise ? `<p>Sunrise ${clock(dd.sunrise)} · sunset ${clock(dd.sunset)} · UV ${dd.uv ?? "–"}${dd.snow ? ` · snow ${dd.snow.toFixed(1)}"` : ""}${dd.precip ? ` · precip ${dd.precip.toFixed(2)}"` : ""} · gusts ${f0(dd.gust)} mph</p>` : ""}
      <table>${srcRows}</table></div>`;
  }).join("") + `<p style="color:var(--faint);font-size:11px;margin:8px 0 0">High/low = ${W ? "average of all sources, weighted so the most accurate ones count more (switch on the Compare tab)" : "average of all sources"}. Thin marks = the coldest low and warmest high any source predicts. Dot = how well the sources agree (green good, yellow fair, red they disagree). Click a day for details.</p>`;
}
function periodDate(p) {
  // NWS period names: "Today", "Tonight", "Wednesday", "Wednesday Night"...
  const base = new Date(D.updated); const names = D.days.map(d => d.date);
  if (/^(today|this afternoon|this morning|tonight|overnight)/i.test(p.name)) return names[0];
  const wd = p.name.split(" ")[0];
  return names.find(d => dayName(d, true) === wd);
}

// ---------------------------------------------------------------- accuracy (forecast vs your station)
let accDays = 30;   // the period scored; changed with the "over the last … days" box (remembered)
const ACC_CHOICES = [7, 14, 30, 60, 90, 180, 365];
const ACC_EXPLAIN = "Accuracy: how close each source's next-day forecast (the one made the day before) came to the " +
  "high and low your own station actually measured.\n±3.3° = on average its high and low were 3.3° off. Lower is better.\n" +
  "Colour = rank among the sources over the chosen period: green most accurate, red least.\n" +
  "Hover a badge for that source's details. Change the period with the 'over the last … days' box.\n" +
  "The global models were filled in from Open-Meteo's archive of past runs; other sources are scored " +
  "from the day WeatherDial started saving their forecasts.";

function accuracy() {
  const rows = (D.verify || []).slice(0, accDays), per = {};
  for (const r of rows)
    for (const [s, f] of Object.entries(r.fc))
      for (const k of ["hi", "lo"])
        if (f[k] != null && r.actual[k] != null) {
          const p = per[s] ??= { hi: [], lo: [], days: new Set() };
          p[k].push(f[k] - r.actual[k]); p.days.add(r.date);
        }
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const out = {};
  for (const [s, p] of Object.entries(per)) {
    const all = [...p.hi, ...p.lo];
    out[s] = { n: p.days.size, mae: mean(all.map(Math.abs)), bias: mean(all),
               mhi: p.hi.length ? mean(p.hi.map(Math.abs)) : null, mlo: p.lo.length ? mean(p.lo.map(Math.abs)) : null };
  }
  const ranked = Object.entries(out).filter(([, a]) => a.n >= 3).sort((a, b) => a[1].mae - b[1].mae);
  ranked.forEach(([s], i) => { out[s].rank = i + 1; out[s].of = ranked.length; });
  return { by: out, days: rows.length };
}
// Weighted averages: each source counts 1 / (its average miss)², so more accurate sources count
// more. Needs 7 scored days, else the source counts as a typical one; weights are kept between
// 1/3 and 3 times the typical weight. The switch on the Compare tab turns this off.
let weighted = true, W = null;
function sourceWeights(A) {
  const scored = Object.entries(A.by).filter(([, a]) => a.n >= 7 && a.mae > 0).map(([s, a]) => [s, 1 / (a.mae * a.mae)]);
  if (!scored.length) return null;
  const ws = scored.map(([, w]) => w).sort((a, b) => a - b), typical = ws[Math.floor(ws.length / 2)];
  const out = { _typical: typical };
  for (const [s, w] of scored) out[s] = Math.max(typical / 3, Math.min(typical * 3, w));
  return out;
}
function applyWeights() {
  W = weighted ? sourceWeights(accuracy()) : null;
  for (const d of D.days)
    for (const k of ["hi", "lo"]) {
      if (d[k + "_simple"] === undefined) d[k + "_simple"] = d[k];
      if (!W) { d[k] = d[k + "_simple"]; continue; }
      let sum = 0, wsum = 0;
      for (const [s, v] of Object.entries(d.by))
        if (v[k] != null) { const w = W[s] ?? W._typical; sum += v[k] * w; wsum += w; }
      if (wsum) d[k] = Math.round(sum / wsum);
    }
}
const shareOf = s => { if (!W) return null; const tot = Object.keys(D.days[1]?.by || {}).reduce((t, x) => t + (W[x] ?? W._typical), 0);
  return Math.round((W[s] ?? W._typical) / tot * 100); };

function accBadge(src, A) {
  const a = A.by[src];
  if (!a || !a.rank) {
    const n = a ? a.n : 0;
    const share = shareOf(src);
    return `<span class="acc none" title="${esc(`${src}: not enough history yet (${n} day${n === 1 ? "" : "s"} scored, needs 3).\n` +
      "WeatherDial saves each source's forecasts and checks them against your station every day, so this fills in by itself." +
      (share != null ? `\nIn the weighted average it counts as a typical source for now (about ${share}%).` : ""))}">${n ? n + "d" : "…"}</span>`;
  }
  const g = a.of > 1 ? 5 - 4 * (a.rank - 1) / (a.of - 1) : 5;
  const lean = Math.abs(a.bias) < 0.75 ? "No consistent lean warm or cold."
    : `Tends to run ${Math.abs(a.bias).toFixed(1)}° too ${a.bias > 0 ? "warm" : "cold"}.`;
  const share = shareOf(src);
  const tip = `${src}: next-day forecast vs your station, last ${accDays} days (${a.n} days scored)\n` +
    `Off by ${a.mae.toFixed(1)}° on average (highs ${a.mhi?.toFixed(1) ?? "–"}°, lows ${a.mlo?.toFixed(1) ?? "–"}°).\n` +
    `${lean}\nRanks #${a.rank} of ${a.of}. Lower is better.` +
    (share != null ? `\nShare of the weighted average: about ${share}%${a.n < 7 ? " (counts as a typical source until it has 7 days)" : ""}.` : "");
  return `<span class="acc" style="background:${goodCol(Math.round(g))}" title="${esc(tip)}">±${a.mae.toFixed(1)}°</span>`;
}
const WEIGHT_EXPLAIN = "On: each day's high and low is a weighted average, so the sources that have been " +
  "most accurate at your place (over the period chosen beside it) count more. A source's weight is " +
  "1 ÷ (its average miss)², kept between ⅓ and 3 times a typical source's weight. Sources with less " +
  "than 7 days of history count as typical.\nOff: every source counts the same.";
function accSelector(A) {
  return `<div class="accbar"><span title="${esc(ACC_EXPLAIN)}">Accuracy ⓘ over the last
    <select class="accsel">${ACC_CHOICES.map(n => `<option value="${n}" ${n === accDays ? "selected" : ""}>${n}</option>`).join("")}</select>
    days</span> <small>(${A.days} day${A.days === 1 ? "" : "s"} of your station's highs and lows so far)</small>
    <label class="wtog" title="${esc(WEIGHT_EXPLAIN)}"><input type="checkbox" class="wchk" ${weighted ? "checked" : ""}> Weight the averages by accuracy ⓘ</label></div>`;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.classList.contains("accsel")) { accDays = +t.value; app()?.remember("acc_days", accDays); }
  else if (t.classList.contains("wchk")) { weighted = t.checked; app()?.remember("weighted", weighted); }
  else return;
  applyWeights(); render();
});

function renderCompare() {
  const days = D.days.slice(0, 8), srcs = [...new Set(days.flatMap(d => Object.keys(d.by)))];
  const A = accuracy();
  const dev = (v, avg) => v == null || avg == null ? "" : v - avg >= 4 ? "dev-hi" : v - avg <= -4 ? "dev-lo" : "";
  const vs = (v, avg) => { if (v == null) return "no forecast"; const d = Math.round(v - avg);
    return `${f0(v)}° (${d === 0 ? "same as" : Math.abs(d) + "° " + (d > 0 ? "warmer than" : "colder than")} the ${f0(avg)}° average)`; };
  const cell = (d, s, i) => { const v = d.by[s]; if (!v || (v.hi == null && v.lo == null)) return `<td style="color:var(--faint)" title="${s} has no forecast for this day">–</td>`;
    const tip = `${s}, ${i ? dayName(d.date, true) : "today"}\nHigh ${vs(v.hi, d.hi)}\nLow ${vs(v.lo, d.lo)}${v.pop != null ? "\nChance of rain/snow " + v.pop + "%" : ""}${v.text ? "\n" + v.text : ""}`;
    return `<td title="${esc(tip)}"><span class="${dev(v.hi, d.hi)}">${f0(v.hi)}</span><span style="color:var(--faint)">/</span><span class="${dev(v.lo, d.lo)}">${f0(v.lo)}</span></td>`; };
  let h = `<h4>Highs / lows by source</h4>${accSelector(A)}<table class="cmp"><tr><th></th><th title="${esc(ACC_EXPLAIN)}">Accuracy ⓘ</th>${days.map((d, i) => `<th>${i ? dayName(d.date) : "Today"}</th>`).join("")}</tr>`;
  h += srcs.map(s => `<tr><td>${s}</td><td>${accBadge(s, A)}</td>${days.map((d, i) => cell(d, s, i)).join("")}</tr>`).join("");
  const avgTip = d => W
    ? `Weighted average of ${d.hi_n} sources (the more accurate ones count more): high ${f0(d.hi)}°, low ${f0(d.lo)}°.\nPlain average would be ${f0(d.hi_simple)}° / ${f0(d.lo_simple)}°.`
    : `Average of ${d.hi_n} sources, all counting the same: high ${f0(d.hi)}°, low ${f0(d.lo)}°`;
  h += `<tr class="cons"><td title="${esc(W ? WEIGHT_EXPLAIN : "Every source counts the same.")}">${W ? "Weighted avg ⓘ" : "Average"}</td><td></td>${days.map(d => `<td title="${esc(avgTip(d))}">${f0(d.hi)}/${f0(d.lo)}</td>`).join("")}</tr>`;
  h += `<tr><td style="color:var(--dim)">Spread (highs)</td><td></td>${days.map(d => `<td style="color:var(--dim)" title="Warmest high ${d.hi_max}° minus coldest high ${d.hi_min}°. Bigger = the sources disagree more.">${d.hi_max - d.hi_min}°</td>`).join("")}</tr></table>`;
  h += `<p style="color:var(--dim);font-size:11px;margin-top:6px">Each cell is <b>high/low</b>. <span class="dev-hi">Red</span> = 4° or more <b>warmer</b> than the average of all sources that day; <span class="dev-lo">blue</span> = 4° or more <b>colder</b>. White = within 4°. Hover over a cell for details.</p>`;
  h += `<h4>Right now</h4><table class="cmp"><tr><th>Reading</th><th>Temp</th><th>Wind</th><th>Humidity</th><th>Pressure</th></tr>` +
    D.readings.map(r => `<tr><td>${esc(r.station)}</td><td>${f0(r.temp)}°</td><td>${f0(r.wind)} ${compass(r.dir)}</td><td>${f0(r.rh)}%</td><td>${r.pressure ? (+r.pressure).toFixed(2) : "–"}</td></tr>`).join("") + `</table>`;
  $("t-compare").innerHTML = h;
}

function renderAfd() {
  const a = D.discussion;
  $("t-afd").innerHTML = a ? `<div style="color:var(--dim);margin-bottom:6px">Written by the forecasters at the National Weather Service in ${esc((a.text.match(/National Weather Service ([^\n]+)/) || [])[1]?.trim() || a.office)}, issued ${new Date(a.issued).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}</div>
    <pre class="afd">${esc(a.text.replace(/^[\s\S]*?(\.(DISCUSSION|SYNOPSIS|KEY MESSAGES))/m, "$1").replace(/&&\s*$/m, ""))}</pre>` : "Not available.";
}

function renderSources() {
  const S = D.sources, A = accuracy();
  const forecasts = new Set(D.days.flatMap(d => Object.keys(d.by)));   // sources that make forecasts
  $("t-sources").innerHTML = accSelector(A) + Object.entries(S).map(([k, s]) => {
    const col = s.state === "ok" ? "var(--good)" : s.state === "no key" ? "var(--faint)" : s.state === "stale" ? "var(--fair)" : "var(--bad)";
    const note = s.state === "ok" ? [s.via ? "via " + s.via : "", s.fetched ? ago(new Date(s.fetched * 1000).toISOString()) : ""].filter(Boolean).join(" · ")
      : s.state === "no key" ? `${/accuweather/i.test(k) ? "key needed" : "free key needed"} · <a href="${s.signup}" target="_blank">sign up</a>`
      : esc(s.error || s.state) + (s.retry ? ` · tries again ${hm(new Date(s.retry * 1000).toISOString())}` : "");
    return `<div class="src"><div class="dot" style="background:${col}"></div><div>${k}${s.keyed ? ' <small style="color:var(--faint)">(key)</small>' : ""}</div><div class="note">${note}</div><div>${forecasts.has(k) ? accBadge(k, A) : ""}</div></div>`;
  }).join("") + `<p style="color:var(--faint);font-size:11px">To add or change a key: right-click the panel → <b>Edit API keys…</b>, paste it, save. It's used from the next refresh. Radar: RainViewer. Map: Esri.</p>`;
}

// ---------------------------------------------------------------- gauges (barometer / thermometer)
let gStyle = "classic", helpOpen = false;
const P2A = p => -135 + (p - 28) / 3 * 270;            // inHg -> degrees (0 = straight up), 28-31 in
const T2A = t => 220 - (Math.max(20, Math.min(110, t)) - 20) / 90 * 80;   // °F -> bottom arc 220°..140°
const pol = (a, r, c = 200) => [c + r * Math.sin(a * Math.PI / 180), c - r * Math.cos(a * Math.PI / 180)];
const ln = (a, r1, r2, st) => { const [x1, y1] = pol(a, r1), [x2, y2] = pol(a, r2); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st}/>`; };
function needle(a, len, tail, w, col, extra = "") {   // a pointer drawn pointing up, then rotated
  return `<g transform="rotate(${a} 200 200)" ${extra}><path d="M${200 - w} 200 L200 ${200 - len} L${200 + w} 200 L200 ${200 + tail}Z" style="fill:${col}"/></g>`;
}

// Classic barometer, laid out like the Rainmeter "WeatherStation" barometer: pressure needle
// round the whole dial (29 left, 30 top, 31 right), a gold reference needle, a red thermometer
// needle pivoting below the centre across a curved scale, and four small corner dials.
const BP2A = p => (p - 30) * 90;                                  // inHg -> degrees, 0 = up
const BT2A = t => 257 - (Math.max(23, Math.min(113, t)) - 23) / 90 * 152;   // °F -> 257°..105°
const polc = (cx, cy, a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
const arcPath = (cx, cy, r, a1, a2) => { const [x1, y1] = polc(cx, cy, a1, r), [x2, y2] = polc(cx, cy, a2, r);
  return `M${x1} ${y1} A${r} ${r} 0 ${Math.abs(a2 - a1) > 180 ? 1 : 0} ${a2 > a1 ? 1 : 0} ${x2} ${y2}`; };
const tk = (cx, cy, a, r1, r2, w, c) => { const [x1, y1] = polc(cx, cy, a, r1), [x2, y2] = polc(cx, cy, a, r2);
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}"/>`; };
const lbl = (cx, cy, a, r, txt, font, c, rotate = false) => { const [x, y] = polc(cx, cy, a, r);
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" dy=".35em" text-anchor="middle" ${rotate ? `transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"` : ""} style="fill:${c};font:${font}">${txt}</text>`; };

function classicBarometer(n, g) {
  const ink = "#222", soft = "#555", serif = "'Times New Roman',Georgia,serif", olde = "'Old English Text MT','UnifrakturMaguntia',Georgia,serif";
  const C = 200, TY = 252;            // dial centre; thermometer pivot (below the centre, like the skin)
  let s = `<defs>
      <radialGradient id="bface" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset=".8" stop-color="#f7f7f5"/><stop offset="1" stop-color="#e4e3df"/></radialGradient>
      <radialGradient id="bdial" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8e8e6"/></radialGradient>
      <filter id="bshadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".45"/></filter>
      <path id="bfall" d="${arcPath(C, C, 84, -140, -9)}"/><path id="brise" d="${arcPath(C, C, 84, 9, 140)}"/></defs>
    <circle cx="${C}" cy="${C}" r="186" fill="url(#bface)" stroke="#9c9c9c" stroke-width="1.5" filter="url(#bshadow)"/>
    <circle cx="${C}" cy="${C}" r="181" fill="none" stroke="#d5d5d2" stroke-width="1"/>`;

  // the traditional words, in blackletter round the rim
  [["Stormy", 28.8], ["Rain", 29.38], ["Change", 30], ["Fair", 30.62], ["Very Dry", 31.2]].forEach(([w, p]) =>
    s += lbl(C, C, BP2A(p), 165, w, `26px ${olde}`, ink, true));

  // inches of mercury: ring, ticks every 0.1, 29 / 30 / 31 and the half-inch "5"s
  s += `<path d="${arcPath(C, C, 136, BP2A(28.7), BP2A(31.3))}" fill="none" stroke="${ink}" stroke-width="1.2"/>
        <path d="${arcPath(C, C, 132, BP2A(28.7), BP2A(31.3))}" fill="none" stroke="${ink}" stroke-width=".6"/>`;
  for (let i = 287; i <= 313; i++) {
    const p = i / 10, a = BP2A(p), whole = i % 10 === 0, half = i % 5 === 0;
    s += tk(C, C, a, 136, whole ? 124 : half ? 126 : 131, whole ? 2.2 : half ? 1.6 : 1, ink);
    if (whole) s += lbl(C, C, a, 148, String(p), `700 17px ${serif}`, ink);
    else if (half) s += lbl(C, C, a, 146, "5", `13px ${serif}`, ink);
  }
  // millibars: ticks every 2 mb, labels every 10
  s += `<path d="${arcPath(C, C, 114, BP2A(970 * .02953), BP2A(1060 * .02953))}" fill="none" stroke="${ink}" stroke-width=".7"/>`;
  for (let mb = 970; mb <= 1060; mb += 2) {
    const a = BP2A(mb * .02953), ten = mb % 10 === 0;
    s += tk(C, C, a, 114, ten ? 106 : 110, ten ? 1.4 : .7, ink);
    if (ten) s += lbl(C, C, a, 97, String(mb), `9px ${serif}`, ink, true);
  }
  s += lbl(C, C, 0, 86, "MILLIBARS", `7px ${serif}`, ink);
  s += `<text style="fill:${soft};font:6.4px ${serif};letter-spacing:.5px"><textPath href="#bfall" startOffset="50%" text-anchor="middle">FALLING DENOTES WEATHER DETERIORATION</textPath></text>
        <text style="fill:${soft};font:6.4px ${serif};letter-spacing:.5px"><textPath href="#brise" startOffset="50%" text-anchor="middle">RISING DENOTES WEATHER IMPROVEMENT</textPath></text>
        ${lbl(C, C, 0, 76, "⟵ ⟶", `9px ${serif}`, soft)}`;

  // centre text, as on the skin: place, conditions, pressure, temperature
  const trendTxt = { rising: "rising", falling: "falling", steady: "steady" }[n.trend] || "";
  s += `<text x="${C}" y="${C - 46}" text-anchor="middle" style="fill:${ink};font:600 12px 'Segoe UI'">${esc(D.location?.near?.split(",")[0] || D.location?.name || "")}</text>
    <text x="${C}" y="${C - 28}" text-anchor="middle" style="fill:${soft};font:11px 'Segoe UI'">${esc(n.text || "")}</text>
    <text x="${C}" y="${C + 38}" text-anchor="middle" style="fill:${ink};font:12px 'Segoe UI';letter-spacing:.5px">BAROMETER</text>
    <text x="${C}" y="${C + 52}" text-anchor="middle" style="fill:${ink};font:600 11px 'Segoe UI'">${n.pressure ? (+n.pressure).toFixed(2) + " in" : "–"}${trendTxt ? " ~ " + trendTxt : ""}</text>`;

  // thermometer: a curved hatched band below the centre, °C inside, °F outside
  s += `<path d="${arcPath(C, TY, 88, 257, 105)}" fill="none" stroke="${ink}" stroke-width="1"/>
        <path d="${arcPath(C, TY, 98, 257, 105)}" fill="none" stroke="${ink}" stroke-width="1"/>`;
  for (let t = 24; t <= 112; t += 2) { const a = BT2A(t), ten = t % 10 === 0;
    s += tk(C, TY, a, 88, 98, ten ? 1.4 : .8, ink); if (ten) s += tk(C, TY, a, 98, 104, 1.4, ink);
    if (ten && t >= 30) s += lbl(C, TY, a, 112, String(t), `9px ${serif}`, ink); }
  for (let c = -5; c <= 45; c += 5) { const a = BT2A(c * 9 / 5 + 32);
    s += tk(C, TY, a, 88, 82, c % 10 === 0 ? 1.4 : .8, ink); if (c % 10 === 0) s += lbl(C, TY, a, 74, String(c), `8px ${serif}`, ink); }
  s += `<text x="${C}" y="${TY + 64}" text-anchor="middle" style="fill:${ink};font:6.5px ${serif};letter-spacing:.8px">CENTIGRADE</text>
    <text x="${C}" y="${TY + 125}" text-anchor="middle" style="fill:${ink};font:6.5px ${serif};letter-spacing:.8px">FAHRENHEIT</text>
    <text x="${C}" y="${C + 70}" text-anchor="middle" style="fill:${ink};font:12px 'Segoe UI';letter-spacing:.5px">THERMOMETER</text>
    <text x="${C}" y="${C + 84}" text-anchor="middle" style="fill:${ink};font:600 11px 'Segoe UI'">${f0(n.temp)}°F</text>`;
  const td = g?.t_today;
  if (td) [[td.lo, "#2a74c9", "Today's low"], [td.hi, "#d9443a", "Today's high"]].forEach(([t, c, l]) => {
    const [x, y] = polc(C, TY, BT2A(t), 86);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${c}"><title>${l}: ${f0(t)}°F</title></circle>`; });

  // needles: gold reference (24 h ago), red thermometer, dark pressure needle on top
  const line = (cx, cy, a, len, tail, w, col, title = "") => { const [x1, y1] = polc(cx, cy, a + 180, tail), [x2, y2] = polc(cx, cy, a, len);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round">${title ? `<title>${title}</title>` : ""}</line>`; };
  if (g?.p_24h != null) s += line(C, C, BP2A(g.p_24h), 146, 0, 2, "#e6c814", `24 hours ago: ${g.p_24h.toFixed(2)} in`) + `<circle cx="${C}" cy="${C}" r="5" fill="#e6c814"/>`;
  if (n.temp != null) s += line(C, TY, BT2A(n.temp), 96, 11, 2, "#dc0000", `Temperature now: ${f0(n.temp)}°F`) +
    `<circle cx="${C}" cy="${TY}" r="4" fill="#dc0000"/><circle cx="${C}" cy="${TY}" r="1.4" fill="#000"/>`;
  if (n.pressure) s += line(C, C, BP2A(+n.pressure), 150, 38, 4, "#2f2f2f", `Pressure now: ${(+n.pressure).toFixed(2)} in`) +
    `<circle cx="${C}" cy="${C}" r="8" fill="#2f2f2f"/><circle cx="${C}" cy="${C}" r="2" fill="#000"/>`;

  // corner dials, like the skin's four small faces
  const d0 = D.days[0] || {}, dd = D.detail_days?.[d0.date] || {};
  const corner = (x, y, title, lines, tip) => `<g><title>${esc(tip)}</title><circle cx="${x}" cy="${y}" r="38" fill="url(#bdial)" stroke="#9c9c9c" stroke-width="1.2" filter="url(#bshadow)"/>
      <text x="${x}" y="${y - (lines.length > 1 ? 12 : 6)}" text-anchor="middle" style="fill:${ink};font:600 10px 'Segoe UI'">${title}</text>
      ${lines.map((l, i) => `<text x="${x}" y="${y + 4 + i * 13}" text-anchor="middle" style="fill:${ink};font:${i ? "10px" : "600 13px"} 'Segoe UI'">${l}</text>`).join("")}</g>`;
  s += corner(40, 40, "Feels", [`${f0(n.feels)}°`], `Feels like ${f0(n.feels)}°F`) +
       corner(360, 40, "Humidity", [`${f0(n.rh)}%`], `Humidity ${f0(n.rh)}%, dew point ${f0(n.dew)}°F`) +
       corner(40, 360, "Wind", [`${f0(n.wind)} mph`, compass(n.dir)], `Wind ${f0(n.wind)} mph from the ${compass(n.dir)}, gusts ${f0(n.gust)}`) +
       corner(360, 360, "Precip", [`${d0.pop ?? 0}%`, dd.precip != null ? `${dd.precip.toFixed(2)} in` : ""], `Chance of rain/snow today ${d0.pop ?? 0}%` + (dd.precip != null ? `, about ${dd.precip.toFixed(2)} in` : ""));
  return `<svg viewBox="0 0 400 400" style="width:100%;height:100%;display:block">${s}</svg>`;
}

// Mercury tubes: a thermometer, a mercury barometer and a rain gauge, side by side.
function mercuryTubes(n, g) {
  const W = 480, H = 330, top = 28, bot = 262;
  const yOf = (v, lo, hi) => bot - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (bot - top);
  let s = `<defs>
    <linearGradient id="glassT" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".25"/><stop offset=".35" stop-color="#ffffff" stop-opacity=".6"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="redM" x1="0" x2="1"><stop offset="0" stop-color="#9e0f0f"/><stop offset=".4" stop-color="#ff4a3d"/><stop offset="1" stop-color="#a51010"/></linearGradient>
    <linearGradient id="hgM" x1="0" x2="1"><stop offset="0" stop-color="#6d737b"/><stop offset=".4" stop-color="#e8ebef"/><stop offset="1" stop-color="#7a8088"/></linearGradient>
    <linearGradient id="waterM" x1="0" x2="1"><stop offset="0" stop-color="#1d5fae"/><stop offset=".4" stop-color="#5aa8ff"/><stop offset="1" stop-color="#1d5fae"/></linearGradient></defs>`;
  const tube = (x, w, fill, v, lo, hi) => {
    const y = yOf(v, lo, hi);
    return `<rect x="${x - w / 2 - 3}" y="${top - 8}" width="${w + 6}" height="${bot - top + 14}" rx="${w / 2 + 3}" style="fill:var(--track);stroke:var(--edge)"/>
      ${v != null ? `<rect x="${x - w / 2}" y="${y}" width="${w}" height="${bot - y + 4}" fill="url(#${fill})"/>` : ""}
      <rect x="${x - w / 2 - 3}" y="${top - 8}" width="${(w + 6) / 2}" height="${bot - top + 14}" rx="${w / 2}" fill="url(#glassT)" opacity=".35"/>`;
  };
  const scale = (x, lo, hi, step, major, side, fmt, conv) => {
    let o = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
      const y = yOf(v, lo, hi), big = Math.abs(v / major - Math.round(v / major)) < 1e-6, dx = side < 0 ? -1 : 1;
      o += `<line x1="${x}" y1="${y}" x2="${x + dx * (big ? 9 : 5)}" y2="${y}" style="stroke:var(--dim)" stroke-width="${big ? 1.2 : .7}"/>`;
      if (big) o += `<text x="${x + dx * 12}" y="${y + 3.5}" text-anchor="${side < 0 ? "end" : "start"}" style="fill:var(--dim);font-size:10px">${fmt(conv ? conv(v) : v)}</text>`;
    }
    return o;
  };
  const marker = (x, v, lo, hi, col, title, side = 1) => v == null ? "" : (() => { const y = yOf(v, lo, hi);
    return `<path d="M${x + side * 2} ${y} l${side * 9} -5 v10z" style="fill:${col}"><title>${esc(title)}</title></path>`; })();

  // thermometer (°F left, °C right) with a bulb
  const tlo = Math.min(0, Math.floor(((g?.t_today?.lo ?? n.temp ?? 30) - 10) / 10) * 10), thi = Math.max(tlo + 70, Math.ceil(((g?.t_today?.hi ?? n.temp ?? 60) + 10) / 10) * 10);
  s += tube(80, 12, "redM", n.temp, tlo, thi) + `<circle cx="80" cy="${bot + 18}" r="17" fill="url(#redM)" style="stroke:var(--edge)"/>`;
  s += scale(70, tlo, thi, 2, 10, -1, v => v + "°") ;
  const cLo = Math.ceil((tlo - 32) * 5 / 9 / 5) * 5, cHi = Math.floor((thi - 32) * 5 / 9 / 5) * 5;
  for (let c = cLo; c <= cHi; c += 5) { const y = yOf(c * 9 / 5 + 32, tlo, thi);
    s += `<line x1="90" y1="${y}" x2="${c % 10 ? 95 : 99}" y2="${y}" style="stroke:var(--dim)" stroke-width="${c % 10 ? .7 : 1.2}"/>` +
         (c % 10 === 0 ? `<text x="102" y="${y + 3.5}" style="fill:var(--faint);font-size:9px">${c}°</text>` : ""); }
  if (g?.t_today) s += marker(90, g.t_today.lo, tlo, thi, "#2a74c9", `Today's low ${f0(g.t_today.lo)}°F`) + marker(90, g.t_today.hi, tlo, thi, "#d9443a", `Today's high ${f0(g.t_today.hi)}°F`);

  // mercury barometer (inHg left, mb right) with a cistern
  const plo = 28.8, phi = 30.8, p = n.pressure ? +n.pressure : null;
  s += tube(240, 12, "hgM", p, plo, phi) + `<rect x="218" y="${bot + 4}" width="44" height="26" rx="5" fill="url(#hgM)" style="stroke:var(--edge)"/>`;
  s += scale(230, plo, phi, .05, .2, -1, v => v.toFixed(1));
  for (let mb = 980; mb <= 1040; mb += 5) { const y = yOf(mb * .02953, plo, phi);
    s += `<line x1="250" y1="${y}" x2="${mb % 20 ? 254 : 258}" y2="${y}" style="stroke:var(--dim)" stroke-width="${mb % 20 ? .7 : 1.2}"/>` +
         (mb % 20 === 0 ? `<text x="261" y="${y + 3.5}" style="fill:var(--faint);font-size:9px">${mb}</text>` : ""); }
  s += marker(250, g?.p_24h, plo, phi, "#c9a227", `24 hours ago: ${g?.p_24h?.toFixed(2)} in`) + marker(250, g?.p_3h, plo, phi, "#8a919c", `3 hours ago: ${g?.p_3h?.toFixed(2)} in`);

  // rain gauge: today's rain, scale grows with the amount
  const rain = n.rain_today ?? 0, rhi = Math.max(0.5, Math.ceil(rain * 4 + 0.5) / 4), ry = yOf(rain, 0, rhi);
  s += `<rect x="372" y="${top - 8}" width="56" height="${bot - top + 14}" rx="6" style="fill:var(--track);stroke:var(--edge)"/>
    <rect x="375" y="${ry}" width="50" height="${bot - ry + 3}" rx="3" fill="url(#waterM)" opacity=".9"/>
    <rect x="375" y="${top - 6}" width="14" height="${bot - top + 10}" rx="3" fill="url(#glassT)" opacity=".35"/>`;
  s += scale(366, 0, rhi, rhi > 1 ? .1 : .05, rhi > 1 ? .5 : .25, -1, v => v.toFixed(2));
  if (n.rain_yesterday != null) { const y = yOf(n.rain_yesterday, 0, rhi);
    s += `<line x1="372" x2="428" y1="${y}" y2="${y}" style="stroke:var(--warm)" stroke-dasharray="4 3"><title>Yesterday: ${(+n.rain_yesterday).toFixed(2)} in</title></line>`; }

  const cap = (x, title, val, sub) => `<text x="${x}" y="${H - 22}" text-anchor="middle" style="fill:var(--text);font:600 13px 'Segoe UI'">${val}</text>
    <text x="${x}" y="${H - 8}" text-anchor="middle" style="fill:var(--dim);font-size:11px">${title}${sub ? " · " + sub : ""}</text>`;
  const trendTxt = { rising: "↗ rising", falling: "↘ falling", steady: "→ steady" }[n.trend] || "";
  s += cap(85, "Thermometer", `${f0(n.temp)}°F`, g?.t_today ? `today ${f0(g.t_today.lo)}–${f0(g.t_today.hi)}°` : "") +
       cap(240, "Barometer", p ? `${p.toFixed(2)} in` : "–", trendTxt) +
       cap(400, "Rain gauge", `${rain.toFixed(2)} in`, n.rain_yesterday != null ? `yesterday ${(+n.rain_yesterday).toFixed(2)}` : "today");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

// Trend graphs: the last 24 hours of pressure, temperature and wind.
function trendGraphs(n, g) {
  const W = Math.max(320, innerW()), now = Date.now() / 1000, t0 = now - 24 * 3600;
  const chart = (title, rows, series, opts) => {
    const h = 110, L = 40, Rr = 10, T = 22, B = 18, ih = h - T - B, iw = W - L - Rr;
    const pts = rows.filter(r => r[0] >= t0);
    if (pts.length < 2) return `<div class="gcap">${title}: not enough history yet</div>`;
    const vals = pts.flatMap(r => series.map(sr => r[sr.i])).filter(v => v != null);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (opts.zero) lo = 0;
    const pad = Math.max((hi - lo) * .12, opts.minSpan / 2); lo -= opts.zero ? 0 : pad; hi += pad;
    const X = t => L + (t - t0) / (now - t0) * iw, Y = v => T + ih - (v - lo) / (hi - lo) * ih;
    let s = `<text x="${L}" y="14" style="fill:var(--text);font:600 12px 'Segoe UI'">${title}</text>
      <text x="${W - Rr}" y="14" text-anchor="end" style="fill:var(--dim);font-size:11px">${opts.summary}</text>`;
    for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = Y(v);
      s += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" style="stroke:var(--cgrid)"/><text x="${L - 4}" y="${y + 3}" text-anchor="end" style="fill:var(--faint);font-size:9px">${opts.fmt(v)}</text>`; }
    for (let hAgo = 24; hAgo >= 0; hAgo -= 6) { const x = X(now - hAgo * 3600);
      s += `<line x1="${x}" x2="${x}" y1="${T}" y2="${T + ih}" style="stroke:var(--cgrid)"/><text x="${x}" y="${h - 4}" text-anchor="middle" style="fill:var(--faint);font-size:9px">${hAgo ? new Date((now - hAgo * 3600) * 1000).toLocaleTimeString("en-US", { hour: "numeric" }) : "now"}</text>`; }
    for (const sr of series) {
      const p = pts.filter(r => r[sr.i] != null);
      if (sr.bars) s += p.map(r => `<rect x="${X(r[0]) - 1.5}" y="${Y(r[sr.i])}" width="3" height="${T + ih - Y(r[sr.i])}" style="fill:${sr.c}" opacity=".55"/>`).join("");
      else s += `<path d="M${p.map(r => `${X(r[0]).toFixed(1)} ${Y(r[sr.i]).toFixed(1)}`).join("L")}" fill="none" style="stroke:${sr.c}" stroke-width="2"/>`;
    }
    for (const m of opts.marks || []) if (m.v != null) s += `<circle cx="${X(m.t)}" cy="${Y(m.v)}" r="3.5" style="fill:${m.c}"><title>${esc(m.title)}</title></circle>`;
    // hover strips with the reading at that time
    const step = iw / pts.length;
    s += pts.map(r => `<rect x="${X(r[0]) - step / 2}" y="${T}" width="${step}" height="${ih}" fill="transparent"><title>${new Date(r[0] * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}: ${opts.tip(r)}</title></rect>`).join("");
    return `<svg width="${W}" height="${h}" style="display:block;margin-bottom:4px">${s}</svg>`;
  };
  const p = g?.p_hist || [], t = g?.t_hist || [], w = g?.w_hist || [];
  const pc = p.length > 1 ? p[p.length - 1][1] - p[0][1] : null;
  const tmin = t.length ? t.reduce((a, r) => r[1] < a[1] ? r : a) : null, tmax = t.length ? t.reduce((a, r) => r[1] > a[1] ? r : a) : null;
  const gmax = w.length ? w.reduce((a, r) => r[2] > a[2] ? r : a) : null;
  return chart("Pressure (sea level, in)", p, [{ i: 1, c: "var(--accent)" }],
      { fmt: v => v.toFixed(2), minSpan: .1, tip: r => `${r[1].toFixed(2)} in`,
        summary: pc != null ? `${pc >= 0 ? "+" : ""}${pc.toFixed(2)} in over 24 h · ${{ rising: "↗ rising", falling: "↘ falling", steady: "→ steady" }[n.trend] || ""}` : "" }) +
    chart("Temperature (°F)", t, [{ i: 1, c: "var(--ctemp)" }],
      { fmt: v => Math.round(v) + "°", minSpan: 4, tip: r => `${r[1].toFixed(1)}°F`,
        summary: tmin ? `24 h low ${f0(tmin[1])}° · high ${f0(tmax[1])}°` : "",
        marks: tmin ? [{ t: tmin[0], v: tmin[1], c: "#2a74c9", title: `Low ${tmin[1]}°F` }, { t: tmax[0], v: tmax[1], c: "#d9443a", title: `High ${tmax[1]}°F` }] : [] }) +
    chart("Wind (mph)", w, [{ i: 2, c: "var(--crainbar)", bars: true }, { i: 1, c: "var(--cwind)" }],
      { fmt: v => Math.round(v), minSpan: 6, zero: true, tip: r => `wind ${f0(r[1])}, gust ${f0(r[2])} mph`,
        summary: gmax ? `strongest gust ${f0(gmax[2])} mph at ${new Date(gmax[0] * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}` : "" });
}

function arcDial({ title, value, min, max, fmt, unit, color, marks = [], sub = "", tip = "" }) {
  const v = Math.max(min, Math.min(max, value ?? min)), A = x => -135 + (x - min) / (max - min) * 270;
  const arc = (a1, a2, r) => { const [x1, y1] = pol(a1, r, 100), [x2, y2] = pol(a2, r, 100);
    return `M${x1} ${y1} A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2} ${y2}`; };
  let s = `<path d="${arc(-135, 135, 78)}" style="stroke:var(--track)" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  if (value != null) s += `<path d="${arc(-135, A(v), 78)}" style="stroke:${color}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  for (const m of marks) if (m.v != null) {
    const [x1, y1] = pol(A(Math.max(min, Math.min(max, m.v))), 64, 100), [x2, y2] = pol(A(Math.max(min, Math.min(max, m.v))), 92, 100);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${m.c}" stroke-width="3" stroke-linecap="round"><title>${esc(m.t)}</title></line>`;
  }
  s += `<text x="100" y="92" text-anchor="middle" style="fill:var(--text);font:300 30px 'Segoe UI'">${value == null ? "–" : fmt(value)}</text>
    <text x="100" y="112" text-anchor="middle" style="fill:var(--dim);font-size:12px">${unit}</text>
    <text x="100" y="178" text-anchor="middle" style="fill:var(--text);font-weight:600;font-size:13px">${title}</text>
    <text x="100" y="196" text-anchor="middle" style="fill:var(--dim);font-size:11px">${sub}</text>
    <text x="${pol(-135, 78, 100)[0]}" y="${pol(-135, 78, 100)[1] + 22}" text-anchor="middle" style="fill:var(--faint);font-size:9px">${fmt(min)}</text>
    <text x="${pol(135, 78, 100)[0]}" y="${pol(135, 78, 100)[1] + 22}" text-anchor="middle" style="fill:var(--faint);font-size:9px">${fmt(max)}</text>`;
  return `<svg viewBox="0 0 200 205"><title>${esc(tip)}</title>${s}</svg>`;
}
function windDial(n) {
  const w = n.wind_max?.today;
  let s = `<circle cx="100" cy="92" r="78" style="fill:none;stroke:var(--track)" stroke-width="12"/>`;
  ["N", "E", "S", "W"].forEach((d, i) => { const [x, y] = pol(i * 90, 60, 100); s += `<text x="${x}" y="${y - 8 + 4}" text-anchor="middle" style="fill:var(--dim);font-size:11px;font-weight:600">${d}</text>`; });
  for (let a = 0; a < 360; a += 30) { const [x1, y1] = pol(a, 70, 100), [x2, y2] = pol(a, 86, 100); s += `<line x1="${x1}" y1="${y1 - 8}" x2="${x2}" y2="${y2 - 8}" style="stroke:var(--faint)" stroke-width="1"/>`; }
  if (n.dir != null) s += `<g transform="rotate(${n.dir} 100 92)"><path d="M100 18 L91 36 L109 36Z" style="fill:var(--accent)"/></g>`;
  s += `<text x="100" y="96" text-anchor="middle" style="fill:var(--text);font:300 30px 'Segoe UI'">${f0(n.wind)}</text>
    <text x="100" y="114" text-anchor="middle" style="fill:var(--dim);font-size:12px">mph ${compass(n.dir)}</text>
    <text x="100" y="186" text-anchor="middle" style="fill:var(--text);font-weight:600;font-size:13px">Wind</text>
    <text x="100" y="202" text-anchor="middle" style="fill:var(--dim);font-size:11px">gust ${f0(n.gust)}${w ? ` · max today ${f0(w.gust)}` : ""}</text>`;
  return `<svg viewBox="0 0 200 205"><title>Wind from the ${compass(n.dir) || "–"} (the arrow points where it's coming from). Gusts ${f0(n.gust)} mph.</title>${s}</svg>`;
}

    <p style="color:var(--dim)">Hover any dial or tick for its exact value. Rising pressure usually means improving weather; falling pressure means change on the way.</p>`,
  tubes: `<h3>Reading the tubes</h3><ul>
      <li><b>Thermometer</b>: the red column is the temperature, °F on the left and °C on the right. The <span style="color:#2a74c9">blue</span> and <span style="color:#d9443a">red</span> arrows are today's low and high so far.</li>
