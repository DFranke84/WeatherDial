<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WeatherDial</title>
<style>
  /* Dark theme (default). Light theme below overrides the same names. */
  :root {
    --face: rgba(24, 26, 30, .78); --edge: #4a4f58; --text: #e8e8e8; --dim: #9aa0aa; --faint: #5d636d;
    --line: #2f343c; --warm: #ffb347; --cold: #6cb6ff; --rain: #4d9fff; --good: #5fd068; --fair: #ffc933;
    --bad: #ff5a4f; --accent: #7cc4ff;
    --cell: #1a1c20; --hover: #ffffff08; --hover2: #ffffff14; --hair: #ffffff0a; --track: #ffffff10;
    --sel: #ffffff1c; --mark: #fff8; --menu: #222; --menuhover: #3a3f48; --tipbg: #111a;
    --devhi: #ff9b8f; --devlo: #8fc2ff; --afd: #cfd3da;
    --cgrid: #ffffff0d; --cfreeze: #6cb6ff88; --cday: #ffffff22; --cdaytxt: #ccc; --cnight: #00000030;
    --cband: #7cc4ff22; --cfeels: #9aa0aa; --ctemp: #ffb347; --crainbar: #4d9fffaa; --csnowbar: #dfe7f5aa;
    --cwind: #8a9; --ccur: #fff6;
    --cl1: #c9d0da; --cl2: #8d96a3; --cl3: #9aa4b2; --cl4: #7d8695; --csnow: #fff; --cmoon: #d7dce6; --cfog: #aab;
    --alert: #5a1a17; --alertedge: #8c2b25; --alerttxt: #ffd2cc; --alertmore: #f0d6d2;
    --warnbg: #5a4410; --warnedge: #8c6a1a;
  }
  body.light {
    --face: rgba(248, 249, 251, .9); --edge: #c3c9d2; --text: #1d2128; --dim: #575e69; --faint: #8a919c;
    --line: #dde1e7; --warm: #d0700f; --cold: #2a74c9; --rain: #2a74c9; --good: #2fa84a; --fair: #c99700;
    --bad: #d9443a; --accent: #2a74c9;
    --cell: #ffffff; --hover: #0000000a; --hover2: #00000012; --hair: #0000000f; --track: #00000014;
    --sel: #0000001a; --mark: #0009; --menu: #fff; --menuhover: #e8edf4; --tipbg: #ffffffee;
    --devhi: #d9443a; --devlo: #2a74c9; --afd: #2b3038;
    --cgrid: #00000012; --cfreeze: #2a74c988; --cday: #00000030; --cdaytxt: #333; --cnight: #0000000c;
    --cband: #2a74c926; --cfeels: #7a818c; --ctemp: #e07b12; --crainbar: #2a74c9aa; --csnowbar: #98a6baaa;
    --cwind: #3d7d5c; --ccur: #0006;
    --cl1: #a3acb9; --cl2: #6f7987; --cl3: #7f8996; --cl4: #5f6875; --csnow: #5f6875; --cmoon: #8f97a6; --cfog: #7f8996;
    --alert: #fde3df; --alertedge: #e9a59c; --alerttxt: #8c1d12; --alertmore: #5a2a24;
    --warnbg: #fff1cc; --warnedge: #e6c66a;
  }
  body.light.preview { background: #c9d6e3 linear-gradient(160deg, #e3ecf5, #b8c6d6); }
  body.light .chip { color: #111; }
  html, body { margin: 0; background: transparent; color: var(--text); user-select: none;
               font: 13px/1.35 "Segoe UI", sans-serif; }
  body.preview { background: #1d2733 linear-gradient(160deg, #24384c, #14181d); min-height: 100vh; padding: 24px; box-sizing: border-box; }
  #panel { position: relative; width: var(--pw, 500px); background: var(--face); border: 1px solid var(--edge); border-radius: 14px;
           overflow: hidden; backdrop-filter: blur(6px); }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header .place { font-weight: 600; }
  header .near { color: var(--dim); }
  header .upd { margin-left: auto; color: var(--faint); font-size: 12px; }
  .btn { cursor: pointer; color: var(--dim); padding: 0 4px; border-radius: 4px; }
  .btn:hover { color: var(--text); background: var(--hover2); }

  .alert { padding: 7px 12px; background: var(--alert); border-bottom: 1px solid var(--alertedge); cursor: pointer; }
  .alert.moderate { background: var(--warnbg); border-color: var(--warnedge); }
  .alert b { color: var(--alerttxt); }
  .alert .more { display: none; white-space: pre-wrap; color: var(--alertmore); margin-top: 6px; font-size: 12px; }
  .alert.open .more { display: block; }

  .now .clock { text-align: right; align-self: start; white-space: nowrap; }
  .now .clock .tm { font-size: 22px; font-weight: 300; line-height: 1.1; }
  .now .clock .dt { color: var(--dim); font-size: 12px; }
  .now { display: grid; grid-template-columns: 74px auto 1fr auto; gap: 4px 12px; padding: 10px 12px 6px; align-items: center; }
  .now .big { font-size: 46px; font-weight: 300; line-height: 1; }
  .now .big sup { font-size: 20px; color: var(--dim); }
  .now .cond { font-size: 15px; }
  .now .from { color: var(--dim); font-size: 12px; }
  .now .hilo { color: var(--dim); }
  .now .hilo b { color: var(--text); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line);
           border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { background: var(--cell); padding: 5px 8px; min-height: 34px; }
  .stat .k { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-weight: 600; }
  .stat .v small { font-weight: 400; color: var(--dim); }

  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav div { flex: 1; text-align: center; padding: 6px 0; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; }
  nav div:hover { color: var(--text); }
  nav div.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab { display: none; padding: 8px 12px 10px; height: var(--tabh, 360px); overflow-y: auto; }
  #grip { height: 9px; cursor: ns-resize; display: flex; align-items: center; justify-content: center;
          border-top: 1px solid var(--line); touch-action: none; }
  #grip::after { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--faint); }
  #grip:hover::after { background: var(--accent); }
  body.compact #grip { display: none; }
  .pywebview-drag-region { cursor: move; }
  #menu { position: fixed; background: var(--menu); border: 1px solid var(--edge); border-radius: 6px; z-index: 20;
          font-size: 13px; color: var(--text); padding: 4px 0; white-space: nowrap; }
  #menu div { padding: 4px 14px; cursor: default; }
  #menu div:hover { background: var(--menuhover); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
  .tab.on { display: block; }
  .tab::-webkit-scrollbar { width: 6px; } .tab::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .seg span { padding: 1px 9px; cursor: pointer; color: var(--dim); }
  .seg span.on { background: var(--sel); color: var(--text); }
  .legend { color: var(--dim); font-size: 11px; margin-left: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 3px 0 8px; }

  svg text { fill: var(--dim); font-size: 10px; }
  #tip { position: fixed; pointer-events: none; background: var(--tipbg); border: 1px solid var(--edge); border-radius: 6px;
         padding: 5px 8px; font-size: 12px; display: none; backdrop-filter: blur(4px); z-index: 9; }

  .day { display: grid; grid-template-columns: 44px 26px minmax(110px, 1fr) 34px 30px minmax(140px, 1.3fr) 30px 14px; gap: 6px; align-items: center;
         padding: 3px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .day:hover { background: var(--hover); }
  .day .dn { font-weight: 600; } .day .dn small { display: block; color: var(--faint); font-weight: 400; font-size: 11px; }
  .day .txt { color: var(--dim); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .day .pop { color: var(--rain); text-align: right; }
  .day .lo { color: var(--cold); text-align: right; } .day .hi { color: var(--warm); }
  .bar { position: relative; height: 6px; background: var(--track); border-radius: 3px; }
  .bar .rng { position: absolute; top: 0; height: 6px; border-radius: 3px; }
  .bar .sp { position: absolute; top: -3px; height: 12px; border-left: 1px solid var(--mark); border-right: 1px solid var(--mark); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .detail { display: none; padding: 4px 4px 8px 50px; color: var(--dim); font-size: 12px; }
  .detail.open { display: block; }
  .detail p { margin: 3px 0; } .detail b { color: var(--text); }
  .detail table { border-collapse: collapse; margin-top: 4px; }
  .detail td { padding: 1px 8px 1px 0; }

  table.cmp { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.cmp th { color: var(--dim); font-weight: 400; text-align: center; padding: 2px; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; white-space: nowrap; }
  table.cmp td { text-align: center; padding: 3px 2px; border-top: 1px solid var(--hair); }
  table.cmp tr.cons td { border-top: 1px solid var(--edge); font-weight: 600; }
  .dev-hi { color: var(--devhi); } .dev-lo { color: var(--devlo); }
  h4 { margin: 10px 0 4px; font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  #wgrip { position: absolute; top: 40px; right: 0; bottom: 20px; width: 7px; cursor: ew-resize; z-index: 8;
           display: flex; align-items: center; justify-content: center; touch-action: none; }
  #wgrip::after { content: ""; width: 3px; height: 40px; border-radius: 2px; background: var(--faint); opacity: 0; transition: opacity .2s; }
  #panel:hover #wgrip::after { opacity: 1; }
  #wgrip:hover::after { background: var(--accent); }
  body.compact #wgrip { bottom: 6px; }
  #radar { position: relative; width: 100%; height: 300px; overflow: hidden; border-radius: 8px; background: #111; }
  #radar img { position: absolute; width: 256px; height: 256px; }
  #radar .layer { position: absolute; inset: 0; }
  #radar .me { position: absolute; width: 8px; height: 8px; margin: -5px 0 0 -5px; border: 1px solid #fff;
               background: var(--bad); border-radius: 50%; z-index: 5; }
  #radar .stamp { position: absolute; left: 8px; bottom: 6px; z-index: 6; background: #000a; padding: 1px 6px; border-radius: 4px; }
  #radar .credit { position: absolute; right: 6px; bottom: 4px; z-index: 6; font-size: 10px; color: #aaa; }

  #mc { padding: 2px 12px 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
  #mc[hidden] { display: none; }
  #mc .ph { font-weight: 600; }
  #mc .ph small { font-weight: 400; color: var(--faint); }
  #mc .strip { grid-column: 1 / -1; position: relative; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  #mc .strip i { position: absolute; top: 0; bottom: 0; }
  #mc .ticks { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; }
  table.idx { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.idx th { color: var(--faint); font-weight: 400; text-align: center; padding: 1px 2px; }
  table.idx td { padding: 3px 2px; border-top: 1px solid var(--hair); text-align: center; }
  table.idx td:first-child { text-align: left; white-space: nowrap; }
  .chip { display: inline-block; min-width: 92px; padding: 1px 6px; border-radius: 4px; color: #111; font-weight: 600; font-size: 11px; }
  .sq { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }
  pre.afd { white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; color: var(--afd); margin: 0; }
  .acc { display: inline-block; min-width: 40px; padding: 0 4px; border-radius: 4px; color: #111; font-size: 11px;
         font-weight: 600; text-align: center; cursor: help; }
  .acc.none { background: var(--track); color: var(--faint); font-weight: 400; }
  .accbar { color: var(--dim); font-size: 12px; margin: 2px 0 6px; cursor: help; }
  .accbar small { color: var(--faint); }
  .wtog { display: block; margin-top: 3px; cursor: help; }
  .wtog input { vertical-align: -2px; margin: 0 4px 0 0; cursor: pointer; }
  .accsel { background: var(--cell); color: var(--text); border: 1px solid var(--edge); border-radius: 4px; font: inherit; }
  .src { display: grid; grid-template-columns: 12px 1fr auto 52px; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--hair); }
  .src .note { color: var(--faint); font-size: 12px; }
  a { color: var(--accent); }
  body.compact nav, body.compact .tab, body.compact .stats .extra { display: none !important; }
  .mini3 { display: none; padding: 6px 12px 10px; gap: 6px; }
  body.compact .mini3 { display: flex; }
  .mini3 div { flex: 1; text-align: center; background: var(--hover); border-radius: 6px; padding: 4px; }
</style>
</head>
<body>
<div id="panel">
  <header class="drag">
    <span class="place" id="place">…</span><span class="near" id="near"></span>
    <span class="upd" id="upd"></span>
    <span class="btn" id="bCompact" title="Compact / full">▭</span>
    <span class="btn" id="bRefresh" title="Refresh now">⟳</span>
  </header>
  <div id="alerts"></div>
  <div class="now drag" id="now"></div>
  <div id="mc" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="mini3" id="mini3"></div>
  <nav id="nav">
    <div data-t="hourly" class="on">Hourly</div><div data-t="daily">16-Day</div><div data-t="compare">Compare</div>
    <div data-t="radar">Radar</div><div data-t="health" id="navHealth" hidden>Health</div><div data-t="afd">Forecaster</div><div data-t="sources">Sources</div>
  </nav>
  <div class="tab on" id="t-hourly"></div>
  <div class="tab" id="t-daily"></div>
  <div class="tab" id="t-compare"></div>
  <div class="tab" id="t-radar"><div id="radar"></div><div style="margin-top:6px;color:var(--dim)" id="radarInfo"></div></div>
  <div class="tab" id="t-health"></div>
  <div class="tab" id="t-afd"></div>
  <div class="tab" id="t-sources"></div>
  <div id="grip" title="Drag to make the panel taller or shorter. Double-click: fit this tab."></div>
  <div id="wgrip" title="Drag to make the panel wider or narrower. Double-click: normal width."></div>
</div>
<div id="tip"></div>
<div id="menu" hidden>
  <div data-act="lock" id="mLock">Lock position</div>
  <div data-act="compact" id="mCompact">Compact</div>
  <hr>
  <div data-zoom="0.85">Size: Small</div>
  <div data-zoom="1">Size: Medium</div>
  <div data-zoom="1.15">Size: Large</div>
  <hr>
  <div data-theme="dark">Theme: Dark</div>
  <div data-theme="light">Theme: Light</div>
  <div data-theme="auto">Theme: Match Windows</div>
  <hr>
  <div data-act="refresh_now">Refresh now</div>
  <div data-act="edit_keys">Edit API keys…</div>
  <div data-act="edit_location">Edit location…</div>
  <hr>
  <div data-act="quit">Close WeatherDial</div>
</div>
<script>
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
if (Q.has("preview")) document.body.classList.add("preview");
let D = null, hourSpan = 48, radarTimer = null;

// ---------------------------------------------------------------- icons (inline SVG)
const SUN = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" style="fill:#ffc94a"/>` +
  [...Array(8)].map((_, i) => { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
    return `<line x1="${x + c * r * 1.45}" y1="${y + s * r * 1.45}" x2="${x + c * r * 1.95}" y2="${y + s * r * 1.95}" stroke="#ffc94a" stroke-width="2" stroke-linecap="round"/>`; }).join("");
const MOON = (x, y, r) => `<path d="M${x + r * .3} ${y - r} a${r} ${r} 0 1 0 ${r * .75} ${r * 1.55} a${r * .8} ${r * .8} 0 0 1 -${r * .75} -${r * 1.55}z" style="fill:var(--cmoon)"/>`;
const CLOUD = (dx = 0, dy = 0, fill = "--cl1") => `<path transform="translate(${dx} ${dy})" d="M9 27h17a6 6 0 0 0 0-12 8 8 0 0 0-15-2 6.5 6.5 0 0 0-2 14z" style="fill:var(${fill})"/>`;
const drops = (c, kind) => [10, 17, 24].map((x, i) => kind === "snow"
  ? `<text x="${x - 2}" y="${36 + (i % 2) * 2}" style="fill:var(--csnow);font-size:9px">✱</text>`
  : `<line x1="${x}" y1="${30 + (i % 2)}" x2="${x - 2}" y2="${36 + (i % 2)}" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`).join("");
function icon(kind, size = 26, night = false) {
  let s;
  switch (kind) {
    case "clear": s = night ? MOON(18, 18, 9) : SUN(18, 18, 7); break;
    case "partly": s = (night ? MOON(23, 12, 7) : SUN(24, 12, 5.5)) + CLOUD(-2, 4); break;
    case "cloudy": s = CLOUD(2, -2, "--cl2") + CLOUD(-2, 3); break;
    case "rain": case "drizzle": s = CLOUD(-1, -2, "--cl3") + drops("#4d9fff"); break;
    case "snow": s = CLOUD(-1, -2) + drops("var(--csnow)", "snow"); break;
    case "sleet": s = CLOUD(-1, -2, "--cl3") + `<line x1="10" y1="30" x2="8" y2="36" stroke="#4d9fff" stroke-width="2"/><text x="15" y="37" style="fill:var(--csnow);font-size:9px">✱</text><line x1="26" y1="30" x2="24" y2="36" stroke="#4d9fff" stroke-width="2"/>`; break;
    case "storm": s = CLOUD(-1, -3, "--cl4") + `<path d="M18 24l-4 7h4l-3 7 8-9h-4l3-5z" fill="#ffd23f"/>`; break;
    case "fog": s = CLOUD(-1, -5) + [26, 31, 36].map(y => `<line x1="6" y1="${y}" x2="30" y2="${y}" style="stroke:var(--cfog)" stroke-width="2" stroke-linecap="round"/>`).join(""); break;
    case "smoke": s = [12, 19, 26].map((y, i) => `<path d="M5 ${y}q6-5 12 0t13 0" stroke="#b9a58a" stroke-width="2.5" fill="none"/>`).join(""); break;
    case "wind": s = `<path d="M4 14h18a4 4 0 1 0-4-4M4 21h24a4 4 0 1 1-4 4M4 28h12" style="stroke:var(--cl1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>`; break;
    default: s = CLOUD(); }
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 40">${s}</svg>`;
}

// ---------------------------------------------------------------- helpers
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => d == null ? "" : DIRS[Math.round(d / 22.5) % 16];
const f0 = v => v == null ? "–" : Math.round(v);
const dayName = (s, long) => { const d = new Date(s + "T12:00"); return d.toLocaleDateString("en-US", { weekday: long ? "long" : "short" }); };
const hourLabel = t => { let h = +t.slice(11, 13); return h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : (h - 12) + "p"; };
const clock = s => s ? new Date(s).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "–";
const hm = s => s ? clock(s).replace(" AM", "a").replace(" PM", "p") : "–";
const tempColor = t => t == null ? "#888" : t < 10 ? "#a78bff" : t < 32 ? "#6cb6ff" : t < 50 ? "#7fd6c2" : t < 70 ? "#c6e06a" : t < 85 ? "#ffb347" : "#ff6a4f";
const aqiInfo = a => a == null ? ["–", "#888"] : a <= 50 ? ["Good", "#5fd068"] : a <= 100 ? ["Moderate", "#ffc933"] : a <= 150 ? ["Unhealthy (sensitive)", "#ff8c3a"] : a <= 200 ? ["Unhealthy", "#ff4f4f"] : ["Very unhealthy", "#b04fff"];
const isNight = () => { const s = D?.sky?.today; if (!s) return false; const n = new Date(); return n < new Date(s.sunrise) || n > new Date(s.sunset); };
const hhmm = s => { if (!s) return ""; let [h, m] = s.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")}${h < 12 ? "a" : "p"}`; };
function windTip(w) {
  if (!w) return "";
  const t = w.today, y = w.yesterday, lines = [];
  lines.push(`Max today: wind ${f0(t.wind)} mph (${hhmm(t.wind_at)}), gust ${f0(t.gust)} mph (${hhmm(t.gust_at)})`);
  if (t.since && t.since !== "00:00") lines.push(`  (since ${hhmm(t.since)}, when WeatherDial started)`);
  if (y) lines.push(`Max yesterday: wind ${f0(y.wind)} mph, gust ${f0(y.gust)} mph` + (y.since && y.since !== "00:00" ? ` (from ${hhmm(y.since)})` : ""));
  return lines.join("\n");
}
// Clock at the top right, updated every second.
function tick() {
  const n = new Date(), t = $("clkT"), d = $("clkD");
  if (!t) return;
  t.textContent = n.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  d.textContent = n.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
setInterval(tick, 1000);
const moonGlyph = p => ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][Math.round(p * 8) % 8];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(iso) {
  if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago";
}

// ---------------------------------------------------------------- render
function render() {
  const L = D.location, n = D.now || {}, today = D.days[0] || {}, sky = D.sky.today || {};
  $("place").textContent = L.name;
  $("near").textContent = L.near ? `· near ${L.near} · ${L.elevation_ft.toLocaleString()} ft` : "";

function renderHourly(force) {

  const temps = H.flatMap(h => [h.temp, ...Object.values(h.by || {})]).filter(v => v != null);

  // night shading

  s += `<path d="M${H.map((h, i) => `${x(i)} ${y(h.temp)}`).join("L")}" fill="none" style="stroke:var(--ctemp)" stroke-width="2.2"/>`;
  // precip chance bars + amount

  H.forEach((h, i) => { const p = h.pop || 0, bw = Math.max(2, (W - 44) / H.length - 1);
    s += `<rect x="${x(i) - bw / 2}" y="${pTop + pb - p / 100 * pb}" width="${bw}" height="${p / 100 * pb}" style="fill:var(${h.icon === "snow" ? "--csnowbar" : "--crainbar"})"/>`; });
  s += `<text x="0" y="${pTop + 8}">%</text>`;
  // icons, temps and hour labels
  H.forEach((h, i) => { if (i % step) return;
    s += `<g transform="translate(${x(i) - 9} ${y(h.temp) - 26})">${icon(h.icon, 18, !h.day)}</g>`;
    s += `<text x="${x(i)}" y="${bot - 20}" text-anchor="middle">${hourLabel(h.t)}</text>`;
    s += `<text x="${x(i)}" y="${bot - 6}" text-anchor="middle" style="fill:var(--cwind)">${f0(h.wind)}</text>`; });
  s += `<text x="0" y="${bot - 6}" style="fill:var(--cwind)">mph</text>`;
  // "Now" marker: where the current time falls between the first hours of the chart.
  const frac = (Date.now() - new Date(H[0].t)) / 3600000;
  if (frac >= 0 && frac <= H.length - 1) {
    const xn = x(0) + frac * (W - 44) / (H.length - 1), i0 = Math.floor(frac), f = frac - i0;
    const tn = H[i0].temp + ((H[i0 + 1]?.temp ?? H[i0].temp) - H[i0].temp) * f;
    s += `<line x1="${xn}" x2="${xn}" y1="${top - 8}" y2="${bot - 18}" style="stroke:var(--accent)" stroke-width="1.5"/>

    <span class="legend"><i style="background:#ffb347"></i>forecast<i style="background:#7cc4ff44;height:8px"></i>all sources' range<i style="background:#4d9fffaa;height:8px"></i>chance of rain/snow</span></div>
    <svg id="hsvg" width="${W}" height="${bot}">${s}</svg>`;
  const svg = $("hsvg"), tip = $("tip");
  svg.onmousemove = e => {

    const c = $("cur"); c.setAttribute("x1", x(i)); c.setAttribute("x2", x(i)); c.setAttribute("visibility", "visible");
    const by = Object.entries(h.by || {}).map(([k, v]) => `<div style="color:#aaa">${k}: ${f0(v)}°</div>`).join("");
    tip.innerHTML = `<b>${dayName(h.t.slice(0, 10))} ${hourLabel(h.t)}</b> ${esc(h.text || "")}<br>${f0(h.temp)}°F (feels ${f0(h.feels)}°) · ${h.pop ?? 0}% · wind ${f0(h.wind)}${h.gust > h.wind ? ", gusts " + f0(h.gust) : ""} mph${h.aqi != null ? " · AQI " + h.aqi : ""}${by}`;
    tip.style.display = "block";
    const z = +document.body.style.zoom || 1, vw = innerWidth / z, vh = innerHeight / z;
    tip.style.left = Math.max(2, Math.min(e.clientX + 14, vw - tip.offsetWidth - 4)) + "px";
    tip.style.top = (e.clientY + 14 + tip.offsetHeight > vh ? Math.max(2, e.clientY - tip.offsetHeight - 10) : e.clientY + 14) + "px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; $("cur").setAttribute("visibility", "hidden"); };
  $("span").onclick = e => { if (e.target.dataset.h) { hourSpan = +e.target.dataset.h; renderHourly(); } };
}

function periodDate(p) {
  // NWS period names: "Today", "Tonight", "Wednesday", "Wednesday Night"...
  const base = new Date(D.updated); const names = D.days.map(d => d.date);
  if (/^(today|this afternoon|this morning|tonight|overnight)/i.test(p.name)) return names[0];
  const wd = p.name.split(" ")[0];
  return names.find(d => dayName(d, true) === wd);
}

// ---------------------------------------------------------------- accuracy (forecast vs your station)
let accDays = 30;   // the period scored; changed with the "over the last … days" box (remembered)
const ACC_CHOICES = [7, 14, 30, 60, 90, 180, 365];
const ACC_EXPLAIN = "Accuracy: how close each source's next-day forecast (the one made the day before) came to the " +
  "high and low your own station actually measured.\n±3.3° = on average its high and low were 3.3° off. Lower is better.\n" +
  "Colour = rank among the sources over the chosen period: green most accurate, red least.\n" +
  "Hover a badge for that source's details. Change the period with the 'over the last … days' box.\n" +
  "The global models were filled in from Open-Meteo's archive of past runs; other sources are scored " +
  "from the day WeatherDial started saving their forecasts.";

function accuracy() {
  const rows = (D.verify || []).slice(0, accDays), per = {};
  for (const r of rows)
    for (const [s, f] of Object.entries(r.fc))
      for (const k of ["hi", "lo"])
        if (f[k] != null && r.actual[k] != null) {
          const p = per[s] ??= { hi: [], lo: [], days: new Set() };
          p[k].push(f[k] - r.actual[k]); p.days.add(r.date);
        }
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const out = {};
  for (const [s, p] of Object.entries(per)) {
    const all = [...p.hi, ...p.lo];
    out[s] = { n: p.days.size, mae: mean(all.map(Math.abs)), bias: mean(all),
               mhi: p.hi.length ? mean(p.hi.map(Math.abs)) : null, mlo: p.lo.length ? mean(p.lo.map(Math.abs)) : null };
  }
  const ranked = Object.entries(out).filter(([, a]) => a.n >= 3).sort((a, b) => a[1].mae - b[1].mae);
  ranked.forEach(([s], i) => { out[s].rank = i + 1; out[s].of = ranked.length; });
  return { by: out, days: rows.length };
}
// Weighted averages: each source counts 1 / (its average miss)², so more accurate sources count
// more. Needs 7 scored days, else the source counts as a typical one; weights are kept between
// 1/3 and 3 times the typical weight. The switch on the Compare tab turns this off.
let weighted = true, W = null;
function sourceWeights(A) {
  const scored = Object.entries(A.by).filter(([, a]) => a.n >= 7 && a.mae > 0).map(([s, a]) => [s, 1 / (a.mae * a.mae)]);
  if (!scored.length) return null;
  const ws = scored.map(([, w]) => w).sort((a, b) => a - b), typical = ws[Math.floor(ws.length / 2)];
  const out = { _typical: typical };
  for (const [s, w] of scored) out[s] = Math.max(typical / 3, Math.min(typical * 3, w));
  return out;
}
function applyWeights() {
  W = weighted ? sourceWeights(accuracy()) : null;
  for (const d of D.days)
    for (const k of ["hi", "lo"]) {
      if (d[k + "_simple"] === undefined) d[k + "_simple"] = d[k];
      if (!W) { d[k] = d[k + "_simple"]; continue; }
      let sum = 0, wsum = 0;
      for (const [s, v] of Object.entries(d.by))
        if (v[k] != null) { const w = W[s] ?? W._typical; sum += v[k] * w; wsum += w; }
      if (wsum) d[k] = Math.round(sum / wsum);
    }
}
const shareOf = s => { if (!W) return null; const tot = Object.keys(D.days[1]?.by || {}).reduce((t, x) => t + (W[x] ?? W._typical), 0);
  return Math.round((W[s] ?? W._typical) / tot * 100); };

function accBadge(src, A) {
  const a = A.by[src];
  if (!a || !a.rank) {
    const n = a ? a.n : 0;
    const share = shareOf(src);
    return `<span class="acc none" title="${esc(`${src}: not enough history yet (${n} day${n === 1 ? "" : "s"} scored, needs 3).\n` +
      "WeatherDial saves each source's forecasts and checks them against your station every day, so this fills in by itself." +
      (share != null ? `\nIn the weighted average it counts as a typical source for now (about ${share}%).` : ""))}">${n ? n + "d" : "…"}</span>`;
  }
  const g = a.of > 1 ? 5 - 4 * (a.rank - 1) / (a.of - 1) : 5;
  const lean = Math.abs(a.bias) < 0.75 ? "No consistent lean warm or cold."
    : `Tends to run ${Math.abs(a.bias).toFixed(1)}° too ${a.bias > 0 ? "warm" : "cold"}.`;
  const share = shareOf(src);
  const tip = `${src}: next-day forecast vs your station, last ${accDays} days (${a.n} days scored)\n` +
    `Off by ${a.mae.toFixed(1)}° on average (highs ${a.mhi?.toFixed(1) ?? "–"}°, lows ${a.mlo?.toFixed(1) ?? "–"}°).\n` +
    `${lean}\nRanks #${a.rank} of ${a.of}. Lower is better.` +
    (share != null ? `\nShare of the weighted average: about ${share}%${a.n < 7 ? " (counts as a typical source until it has 7 days)" : ""}.` : "");
  return `<span class="acc" style="background:${goodCol(Math.round(g))}" title="${esc(tip)}">±${a.mae.toFixed(1)}°</span>`;
}
const WEIGHT_EXPLAIN = "On: each day's high and low is a weighted average, so the sources that have been " +
  "most accurate at your place (over the period chosen beside it) count more. A source's weight is " +
  "1 ÷ (its average miss)², kept between ⅓ and 3 times a typical source's weight. Sources with less " +
  "than 7 days of history count as typical.\nOff: every source counts the same.";
function accSelector(A) {
  return `<div class="accbar"><span title="${esc(ACC_EXPLAIN)}">Accuracy ⓘ over the last
    <select class="accsel">${ACC_CHOICES.map(n => `<option value="${n}" ${n === accDays ? "selected" : ""}>${n}</option>`).join("")}</select>
    days</span> <small>(${A.days} day${A.days === 1 ? "" : "s"} of your station's highs and lows so far)</small>
    <label class="wtog" title="${esc(WEIGHT_EXPLAIN)}"><input type="checkbox" class="wchk" ${weighted ? "checked" : ""}> Weight the averages by accuracy ⓘ</label></div>`;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.classList.contains("accsel")) { accDays = +t.value; app()?.remember("acc_days", accDays); }
  else if (t.classList.contains("wchk")) { weighted = t.checked; app()?.remember("weighted", weighted); }
  else return;
  applyWeights(); render();
});

function renderCompare() {
  const days = D.days.slice(0, 8), srcs = [...new Set(days.flatMap(d => Object.keys(d.by)))];
  const A = accuracy();
  const dev = (v, avg) => v == null || avg == null ? "" : v - avg >= 4 ? "dev-hi" : v - avg <= -4 ? "dev-lo" : "";
  const vs = (v, avg) => { if (v == null) return "no forecast"; const d = Math.round(v - avg);
    return `${f0(v)}° (${d === 0 ? "same as" : Math.abs(d) + "° " + (d > 0 ? "warmer than" : "colder than")} the ${f0(avg)}° average)`; };
  const cell = (d, s, i) => { const v = d.by[s]; if (!v || (v.hi == null && v.lo == null)) return `<td style="color:var(--faint)" title="${s} has no forecast for this day">–</td>`;
    const tip = `${s}, ${i ? dayName(d.date, true) : "today"}\nHigh ${vs(v.hi, d.hi)}\nLow ${vs(v.lo, d.lo)}${v.pop != null ? "\nChance of rain/snow " + v.pop + "%" : ""}${v.text ? "\n" + v.text : ""}`;
    return `<td title="${esc(tip)}"><span class="${dev(v.hi, d.hi)}">${f0(v.hi)}</span><span style="color:var(--faint)">/</span><span class="${dev(v.lo, d.lo)}">${f0(v.lo)}</span></td>`; };
  let h = `<h4>Highs / lows by source</h4>${accSelector(A)}<table class="cmp"><tr><th></th><th title="${esc(ACC_EXPLAIN)}">Accuracy ⓘ</th>${days.map((d, i) => `<th>${i ? dayName(d.date) : "Today"}</th>`).join("")}</tr>`;
  h += srcs.map(s => `<tr><td>${s}</td><td>${accBadge(s, A)}</td>${days.map((d, i) => cell(d, s, i)).join("")}</tr>`).join("");
  const avgTip = d => W
    ? `Weighted average of ${d.hi_n} sources (the more accurate ones count more): high ${f0(d.hi)}°, low ${f0(d.lo)}°.\nPlain average would be ${f0(d.hi_simple)}° / ${f0(d.lo_simple)}°.`
    : `Average of ${d.hi_n} sources, all counting the same: high ${f0(d.hi)}°, low ${f0(d.lo)}°`;
  h += `<tr class="cons"><td title="${esc(W ? WEIGHT_EXPLAIN : "Every source counts the same.")}">${W ? "Weighted avg ⓘ" : "Average"}</td><td></td>${days.map(d => `<td title="${esc(avgTip(d))}">${f0(d.hi)}/${f0(d.lo)}</td>`).join("")}</tr>`;
  h += `<tr><td style="color:var(--dim)">Spread (highs)</td><td></td>${days.map(d => `<td style="color:var(--dim)" title="Warmest high ${d.hi_max}° minus coldest high ${d.hi_min}°. Bigger = the sources disagree more.">${d.hi_max - d.hi_min}°</td>`).join("")}</tr></table>`;
  h += `<p style="color:var(--dim);font-size:11px;margin-top:6px">Each cell is <b>high/low</b>. <span class="dev-hi">Red</span> = 4° or more <b>warmer</b> than the average of all sources that day; <span class="dev-lo">blue</span> = 4° or more <b>colder</b>. White = within 4°. Hover over a cell for details.</p>`;
  h += `<h4>Right now</h4><table class="cmp"><tr><th>Reading</th><th>Temp</th><th>Wind</th><th>Humidity</th><th>Pressure</th></tr>` +
    D.readings.map(r => `<tr><td>${esc(r.station)}</td><td>${f0(r.temp)}°</td><td>${f0(r.wind)} ${compass(r.dir)}</td><td>${f0(r.rh)}%</td><td>${r.pressure ? (+r.pressure).toFixed(2) : "–"}</td></tr>`).join("") + `</table>`;
  $("t-compare").innerHTML = h;
}

function renderAfd() {
  const a = D.discussion;
  $("t-afd").innerHTML = a ? `<div style="color:var(--dim);margin-bottom:6px">Written by the NWS forecasters in ${a.office === "MSO" ? "Missoula" : a.office}, issued ${new Date(a.issued).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}</div>
    <pre class="afd">${esc(a.text.replace(/^[\s\S]*?(\.(DISCUSSION|SYNOPSIS|KEY MESSAGES))/m, "$1").replace(/&&\s*$/m, ""))}</pre>` : "Not available.";
}

function renderSources() {
  const S = D.sources, A = accuracy();
  const forecasts = new Set(D.days.flatMap(d => Object.keys(d.by)));   // sources that make forecasts
  $("t-sources").innerHTML = accSelector(A) + Object.entries(S).map(([k, s]) => {
    const col = s.state === "ok" ? "var(--good)" : s.state === "no key" ? "var(--faint)" : s.state === "stale" ? "var(--fair)" : "var(--bad)";
    const note = s.state === "ok" ? [s.via ? "via " + s.via : "", s.fetched ? ago(new Date(s.fetched * 1000).toISOString()) : ""].filter(Boolean).join(" · ")
      : s.state === "no key" ? `${/accuweather/i.test(k) ? "key needed" : "free key needed"} · <a href="${s.signup}" target="_blank">sign up</a>`
      : esc(s.error || s.state) + (s.retry ? ` · tries again ${hm(new Date(s.retry * 1000).toISOString())}` : "");
    return `<div class="src"><div class="dot" style="background:${col}"></div><div>${k}${s.keyed ? ' <small style="color:var(--faint)">(key)</small>' : ""}</div><div class="note">${note}</div><div>${forecasts.has(k) ? accBadge(k, A) : ""}</div></div>`;
  }).join("") + `<p style="color:var(--faint);font-size:11px">To add or change a key: right-click the panel → <b>Edit API keys…</b>, paste it, save. It's used from the next refresh. Radar: RainViewer. Map: Esri.</p>`;
}

// ---------------------------------------------------------------- radar (RainViewer over CARTO dark tiles)
async function radar() {
  // The map fills the tab: as wide as the panel, as tall as the tab area allows.
  const light = document.body.classList.contains("light"), shade = light ? "Light" : "Dark";
  const box = $("radar"), W = innerW(), H = Math.max(260, tabH - 34), size = `${W}x${H}${shade}`;
  // Rebuild when the size or theme changed, or the frames are over 10 minutes old.
  if (box.dataset.ok === size && Date.now() - (+box.dataset.at || 0) < 10 * 60 * 1000) return;
  box.dataset.at = Date.now();
  box.style.height = H + "px";
  const z = 7, L = D.location, n = 2 ** z;
  const fx = (L.lon + 180) / 360 * n, lat = L.lat * Math.PI / 180;
  const fy = (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * n;
  const ox = W / 2 - (fx % 1) * 256, oy = H / 2 - (fy % 1) * 256, tx = Math.floor(fx), ty = Math.floor(fy);
  const nx = Math.ceil(W / 512) + 1, ny = Math.ceil(H / 512) + 1;
  const tiles = []; for (let dx = -nx; dx <= nx; dx++) for (let dy = -ny; dy <= ny; dy++) tiles.push([dx, dy]);
  const place = (url, dx, dy, op = 1) => `<img src="${url}" style="left:${ox + dx * 256}px;top:${oy + dy * 256}px;opacity:${op}" onerror="this.remove()">`;
  box.innerHTML = tiles.map(([dx, dy]) => place(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${shade}_Gray_Base/MapServer/tile/${z}/${ty + dy}/${tx + dx}`, dx, dy)).join("") +
    `<div class="layer" style="z-index:4">` + tiles.map(([dx, dy]) => place(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${shade}_Gray_Reference/MapServer/tile/${z}/${ty + dy}/${tx + dx}`, dx, dy)).join("") + `</div>` +
    `<div class="me" style="left:${W / 2}px;top:${H / 2}px"></div><div class="stamp" id="rstamp"></div><div class="credit">Map © Esri · Radar RainViewer</div>`;
  try {
    const m = await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json();
    const frames = m.radar.past.slice(-8);
    const layers = frames.map(f => { const d = document.createElement("div"); d.className = "layer"; d.style.visibility = "hidden";
      d.innerHTML = tiles.map(([dx, dy]) => place(`${m.host}${f.path}/256/${z}/${tx + dx}/${ty + dy}/2/1_1.png`, dx, dy, .8)).join("");
      box.insertBefore(d, box.querySelector(".me")); return d; });
    // Start on the newest frame, hold it ~2 s, then loop through the older ones.
    let k = layers.length - 1, hold = 0; clearTimeout(radarTimer);
    const step = () => {
      layers.forEach((l, j) => l.style.visibility = j === k ? "visible" : "hidden");
      const t = new Date(frames[k].time * 1000), mins = Math.round((Date.now() - t) / 60000);
      $("rstamp").textContent = t.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + (mins > 1 ? ` · ${mins} min ago` : " · latest");
      const wait = k === layers.length - 1 ? 2000 : 500;
      k = (k + 1) % layers.length;
      radarTimer = setTimeout(step, wait);
    };
    step();
    $("radarInfo").textContent = `Last ${frames.length * 10} minutes of radar, looping. Red dot = home.`;
    box.dataset.ok = size;
  } catch (e) { $("radarInfo").textContent = "Radar not available: " + e.message; }
}

// ---------------------------------------------------------------- events + loading
const app = () => window.pywebview?.api;     // set when running as the desktop panel
function showTab(t) {
  document.querySelectorAll("nav div").forEach(d => d.classList.toggle("on", d.dataset.t === t));
  document.querySelectorAll(".tab").forEach(d => d.classList.toggle("on", d.id === "t-" + t));
  if (t === "radar" && D) radar();
}
$("nav").onclick = e => { const t = e.target.dataset.t; if (!t) return; showTab(t); app()?.remember("tab", t); };
document.body.addEventListener("click", e => {
  const link = e.target.closest("a[href]");
  if (link && app()) { e.preventDefault(); app().open_url(link.href); return; }
  const a = e.target.closest(".alert"); if (a) a.classList.toggle("open");
  const d = e.target.closest(".day"); if (d) $("dd" + d.dataset.i).classList.toggle("open"); });
function setCompact(on) { document.body.classList.toggle("compact", on); $("mCompact").textContent = on ? "Full size" : "Compact"; }
$("bCompact").onclick = () => { const on = !document.body.classList.contains("compact"); setCompact(on); app()?.remember("compact", on); };
$("bRefresh").onclick = () => load(true);

// ---------------------------------------------------------------- desktop panel: drag, menu, size
let locked = false, dragging = false;
function setLocked(on) {
  locked = on;
  document.querySelectorAll(".drag").forEach(el => el.classList.toggle("pywebview-drag-region", !on && !!app()));
  $("mLock").textContent = on ? "Unlock position" : "Lock position";
}
function setZoom(z) { document.body.style.zoom = z; }

// Theme: "dark", "light" or "auto" (follows Windows' light/dark app setting).
let theme = "dark";
const winLight = matchMedia("(prefers-color-scheme: light)");
function setTheme(t, save) {
  theme = ["dark", "light", "auto"].includes(t) ? t : "dark";
  const light = theme === "light" || (theme === "auto" && winLight.matches);
  document.body.classList.toggle("light", light);
  document.querySelectorAll("#menu [data-theme]").forEach(m =>
    m.textContent = (m.dataset.theme === theme ? "✓ " : "") + m.textContent.replace(/^✓ /, ""));
  if (D && $("t-radar").classList.contains("on")) radar();   // the map has a light and a dark version
  if (save) app()?.remember("theme", theme);
}
winLight.addEventListener("change", () => { if (theme === "auto") setTheme("auto", false); });
setTheme("dark", false);   // the saved theme is applied when the app reports its settings

// Usable width inside the panel (chart and radar size to this).
const innerW = () => Math.max(300, $("panel").clientWidth - 24);

// Right-edge handle: drag to change the panel's width (remembered). Double-click: normal width.
let panelW = 500, wTimer = null;
function setPanelWidth(w, save) {
  const z = +document.body.style.zoom || 1;
  panelW = Math.round(Math.max(460, Math.min(screen.availWidth / z - 20, w)));
  document.documentElement.style.setProperty("--pw", panelW + "px");
  clearTimeout(wTimer);   // redraw the chart (and radar) once the size settles
  wTimer = setTimeout(() => { if (D) { renderHourly(); if ($("t-radar").classList.contains("on")) radar(); } }, save ? 0 : 60);
  if (save) app()?.remember("pw", panelW);
}
const wgrip = $("wgrip");
wgrip.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  try { wgrip.setPointerCapture(e.pointerId); } catch {}
  const x0 = e.screenX, w0 = panelW, z = +document.body.style.zoom || 1;
  wgrip.onpointermove = m => setPanelWidth(w0 + (m.screenX - x0) / z, false);
  wgrip.onpointerup = () => { wgrip.onpointermove = wgrip.onpointerup = null; setPanelWidth(panelW, true); };
});
wgrip.addEventListener("dblclick", () => setPanelWidth(500, true));

// Bottom-edge handle: drag to change the height of the tab area (remembered).
// Double-click: make it exactly tall enough for the tab that's showing.
let tabH = 360;
function setTabHeight(h, save, noCap) {
  const z = +document.body.style.zoom || 1;
  const rest = $("panel").getBoundingClientRect().height / z - document.querySelector(".tab.on").getBoundingClientRect().height / z;
  const maxH = noCap ? 5000 : Math.max(200, screen.availHeight / z - rest - 20);   // never taller than the screen
  tabH = Math.round(Math.max(200, Math.min(maxH, h)));
  document.documentElement.style.setProperty("--tabh", tabH + "px");
  if (save) app()?.remember("tabh", tabH);
}
const grip = $("grip");
grip.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  e.preventDefault();
  try { grip.setPointerCapture(e.pointerId); } catch {}
  const y0 = e.screenY, h0 = tabH, z = +document.body.style.zoom || 1;
  grip.onpointermove = m => setTabHeight(h0 + (m.screenY - y0) / z, false);
  grip.onpointerup = () => { grip.onpointermove = grip.onpointerup = null; setTabHeight(tabH, true);
    if ($("t-radar").classList.contains("on")) radar(); };
});
grip.addEventListener("dblclick", () => {
  const t = document.querySelector(".tab.on"), cs = getComputedStyle(t);
  t.style.height = "auto";
  const h = t.offsetHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  t.style.height = "";
  setTabHeight(h, true);
});
document.addEventListener("mousedown", e => {
  if (e.button === 0 && e.target.closest(".pywebview-drag-region") && !e.target.closest(".btn")) { dragging = true; app()?.dragging(true); }
});
document.addEventListener("mouseup", () => { if (dragging) { dragging = false; app()?.dragging(false); } });
const menu = $("menu");
document.addEventListener("contextmenu", e => {
  if (!app()) return;
  e.preventDefault();
  menu.hidden = false;
  menu.style.left = Math.min(e.clientX, innerWidth / (+document.body.style.zoom || 1) - menu.offsetWidth - 4) + "px";
  menu.style.top = Math.min(e.clientY, innerHeight / (+document.body.style.zoom || 1) - menu.offsetHeight - 4) + "px";
});
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.hidden = true; });
menu.onclick = async e => {
  const t = e.target, act = t.dataset.act, z = t.dataset.zoom;
  menu.hidden = true;
  if (z) { setZoom(+z); app().remember("zoom", +z); }
  else if (t.dataset.theme) setTheme(t.dataset.theme, true);
  else if (act === "lock") setLocked(await app().toggle_lock());
  else if (act === "compact") $("bCompact").click();
  else if (act) app()[act]();
};
// Keep the window exactly the size of the panel (it changes with compact mode, alerts, size).
new ResizeObserver(() => {
  if (!app()) return;
  const r = $("panel").getBoundingClientRect();
  app().fit(Math.ceil(r.right) + 1, Math.ceil(r.bottom) + 1);
}).observe($("panel"));
window.addEventListener("pywebviewready", async () => {
  const s = await app().settings();
  setZoom(s.zoom); setCompact(s.compact); setLocked(s.locked); showTab(s.tab);
  if (s.tabh) setTabHeight(s.tabh, false);
  if (s.pw) setPanelWidth(s.pw, false);
  setTheme(s.theme || "dark", false);
  if (s.acc_days) accDays = s.acc_days;
  if (s.weighted === false) weighted = false;
  if (D) { applyWeights(); render(); }
  const r = $("panel").getBoundingClientRect();
  app().fit(Math.ceil(r.right) + 1, Math.ceil(r.bottom) + 1);
});

async function load(force) {
  if (!force && document.activeElement?.classList.contains("accsel")) return;   // dropdown open: wait
  try {
    const r = await fetch("data/latest.json" + (force ? "?force=1" : ""), { cache: "no-store" });
    D = await r.json();
    if (Q.has("noextras")) {   // screenshot of the panel without the optional AccuWeather / Tempest extras
      D.minutecast = D.indices = null;
      if (D.now) ["strikes_3h", "strike_dist", "strike_time", "rain_yesterday"].forEach(k => delete D.now[k]);
    }
    applyWeights();
    const openDays = [...document.querySelectorAll(".detail.open")].map(x => x.id);
    const scrolls = [...document.querySelectorAll(".tab")].map(t => t.scrollTop);   // keep your place
    render();
    openDays.forEach(id => $(id)?.classList.add("open"));
    document.querySelectorAll(".tab").forEach((t, i) => t.scrollTop = scrolls[i]);
  } catch (e) { $("upd").textContent = "can't load data: " + e.message; }
}
load().then(() => {   // ?tab=daily / ?compact: open that way (used for screenshots)
  if (Q.get("tab")) showTab(Q.get("tab"));
  if (Q.has("compact")) setCompact(true);
  if (Q.get("acc") || Q.has("simple")) {
    if (Q.get("acc")) accDays = +Q.get("acc");
    if (Q.has("simple")) weighted = false;
    applyWeights(); render();
  }
  if (Q.get("pw")) setPanelWidth(+Q.get("pw"), false);
  if (Q.get("theme")) setTheme(Q.get("theme"), false);
  if (Q.get("tabh")) setTabHeight(+Q.get("tabh"), false, true);
  if (Q.get("span")) { hourSpan = +Q.get("span"); renderHourly(); }
  if (Q.get("open")) $("dd" + Q.get("open"))?.classList.add("open");
  if (Q.get("hover")) {   // show the hourly tooltip at hour N
    const svg = $("hsvg"), r = svg.getBoundingClientRect(), n = Math.min(hourSpan, D.hourly.length);
    const px = r.left + 30 + (+Q.get("hover")) * (innerW() - 44) / (n - 1);
    svg.dispatchEvent(new MouseEvent("mousemove", { clientX: px, clientY: r.top + 90, bubbles: true }));
  }
  if (Q.has("menu")) { menu.hidden = false; menu.style.left = "300px"; menu.style.top = "70px"; }
});
setInterval(load, 15 * 1000);   // the app re-reads your station every 15 s too
</script>
